<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAITSSS Desktop Animation</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#07131f}
iframe{display:block;width:100%;height:760px;border:0;background:#07131f}
</style>
</head>
<body>
<iframe id="preview" src="/animation-evaluation.html?v=model-to-desktop-20260908-1" title="BAITSSS scientific model to desktop software animation"></iframe>
<script>
(function(){
  const frame=document.getElementById('preview');
  let ro=null;
  function fit(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      const h=Math.ceil(Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0,700));
      frame.style.height=h+'px';
      document.documentElement.style.height=h+'px';
      document.body.style.height=h+'px';
    }catch(e){frame.style.height='760px';}
  }
  frame.addEventListener('load',function(){
    fit();
    try{
      const doc=frame.contentDocument;
      if(ro)ro.disconnect();
      ro=new ResizeObserver(fit);
      ro.observe(doc.documentElement);
      if(doc.body)ro.observe(doc.body);
    }catch(e){}
    setTimeout(fit,100);
    setTimeout(fit,500);
    setTimeout(fit,1200);
    setTimeout(fit,3000);
    setTimeout(fit,9000);
    setTimeout(fit,12000);
  });
  window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
