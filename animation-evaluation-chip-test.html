<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAITSSS Animation Chip Test</title><style>html,body{margin:0;background:#07131f}iframe{display:block;width:100%;height:980px;border:0;background:#07131f}</style></head>
<body>
<iframe id="preview" src="/animation-evaluation.html" title="BAITSSS animation realistic worker chips"></iframe>
<script>
const CHIP='/assets/worker-chip-board.webp?v=1';
const SAT_ATMOS='/assets/published-science/Satellite%20atmos.png?v=1';
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const units=doc && [...doc.querySelectorAll('#workers .workerUnit')];
  if(!doc || !units || units.length!==4 || doc.querySelectorAll('.realWorkerChip').length) return;
  const NS='http://www.w3.org/2000/svg';
  const xs=[716,818,920,1022];

  // Replace only the weather + field presentation with the approved satellite/atmosphere visual.
  const svg=doc.querySelector('svg');
  const through1=doc.getElementById('through1');
  if(svg && through1 && !doc.querySelector('.satAtmosFieldVisual')){
    const defs=svg.querySelector('defs');
    const clip=doc.createElementNS(NS,'clipPath');
    clip.setAttribute('id','satAtmosFieldClip');
    const clipRect=doc.createElementNS(NS,'rect');
    clipRect.setAttribute('x','40'); clipRect.setAttribute('y','145');
    clipRect.setAttribute('width','610'); clipRect.setAttribute('height','305');
    clipRect.setAttribute('rx','18');
    clip.appendChild(clipRect);
    if(defs) defs.appendChild(clip);

    const visual=doc.createElementNS(NS,'image');
    visual.setAttribute('class','satAtmosFieldVisual');
    visual.setAttribute('href',SAT_ATMOS);
    visual.setAttribute('x','40'); visual.setAttribute('y','145');
    visual.setAttribute('width','610'); visual.setAttribute('height','305');
    visual.setAttribute('preserveAspectRatio','xMidYMin slice');
    visual.setAttribute('clip-path','url(#satAtmosFieldClip)');
    visual.setAttribute('pointer-events','none');
    through1.parentNode.insertBefore(visual,through1);

    const border=doc.createElementNS(NS,'rect');
    border.setAttribute('x','40'); border.setAttribute('y','145');
    border.setAttribute('width','610'); border.setAttribute('height','305');
    border.setAttribute('rx','18');
    border.setAttribute('fill','none');
    border.setAttribute('stroke','rgba(201,238,130,.28)');
    border.setAttribute('stroke-width','1.5');
    border.setAttribute('pointer-events','none');
    through1.parentNode.insertBefore(border,through1);
  }

  // Small source cues at the existing four weather-ball entry points.
  // Balls, paths and timing remain unchanged; each ball now visibly emerges from a weather variable.
  if(svg && through1 && !doc.querySelector('.weatherEntrySources')){
    const sources=doc.createElementNS(NS,'g');
    sources.setAttribute('class','weatherEntrySources');
    sources.setAttribute('pointer-events','none');

    const makeBase=(cy,color)=>{
      const g=doc.createElementNS(NS,'g');
      const c=doc.createElementNS(NS,'circle');
      c.setAttribute('cx','72'); c.setAttribute('cy',String(cy)); c.setAttribute('r','12');
      c.setAttribute('fill','rgba(7,19,31,.82)'); c.setAttribute('stroke',color); c.setAttribute('stroke-width','1.5');
      g.appendChild(c);
      return g;
    };

    // Solar radiation.
    let g=makeBase(282,'#f1b35b');
    let c=doc.createElementNS(NS,'circle'); c.setAttribute('cx','72'); c.setAttribute('cy','282'); c.setAttribute('r','4'); c.setAttribute('fill','#f1b35b'); g.appendChild(c);
    [[72,272,72,275],[72,289,72,292],[62,282,65,282],[79,282,82,282],[65,275,67.2,277.2],[76.8,286.8,79,289],[79,275,76.8,277.2],[67.2,286.8,65,289]].forEach(p=>{const l=doc.createElementNS(NS,'line'); l.setAttribute('x1',p[0]);l.setAttribute('y1',p[1]);l.setAttribute('x2',p[2]);l.setAttribute('y2',p[3]);l.setAttribute('stroke','#f1b35b');l.setAttribute('stroke-width','1.4');l.setAttribute('stroke-linecap','round');g.appendChild(l);});
    sources.appendChild(g);

    // Air temperature.
    g=makeBase(315,'#caa7ff');
    let stem=doc.createElementNS(NS,'rect'); stem.setAttribute('x','70'); stem.setAttribute('y','306'); stem.setAttribute('width','4'); stem.setAttribute('height','11'); stem.setAttribute('rx','2'); stem.setAttribute('fill','none'); stem.setAttribute('stroke','#caa7ff'); stem.setAttribute('stroke-width','1.4'); g.appendChild(stem);
    c=doc.createElementNS(NS,'circle'); c.setAttribute('cx','72'); c.setAttribute('cy','319'); c.setAttribute('r','3.3'); c.setAttribute('fill','#caa7ff'); g.appendChild(c);
    let l=doc.createElementNS(NS,'line'); l.setAttribute('x1','72');l.setAttribute('y1','309');l.setAttribute('x2','72');l.setAttribute('y2','317');l.setAttribute('stroke','#caa7ff');l.setAttribute('stroke-width','1.5');l.setAttribute('stroke-linecap','round');g.appendChild(l);
    sources.appendChild(g);

    // Humidity.
    g=makeBase(348,'#52b7ff');
    let drop=doc.createElementNS(NS,'path'); drop.setAttribute('d','M72 339 C77 345 79 348 79 352 A7 7 0 0 1 65 352 C65 348 67 345 72 339 Z'); drop.setAttribute('fill','#52b7ff'); g.appendChild(drop);
    sources.appendChild(g);

    // Wind speed.
    g=makeBase(381,'#87d7cf');
    ['M64 377 H76 C79 377 80 375 80 373','M64 381 H79 C82 381 83 383 81 385','M64 385 H73'].forEach(d=>{const p=doc.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#87d7cf');p.setAttribute('stroke-width','1.6');p.setAttribute('stroke-linecap','round');g.appendChild(p);});
    sources.appendChild(g);

    through1.parentNode.insertBefore(sources,through1);
  }

  // Border-only device treatment for the WORKING IT OUT panel.
  const panel=[...doc.querySelectorAll('rect')].find(r=>r.getAttribute('x')==='690'&&r.getAttribute('y')==='145'&&r.getAttribute('width')==='450'&&r.getAttribute('height')==='305');
  if(svg && panel && !doc.querySelector('.computeDeviceBezel')){
    const outer=doc.createElementNS(NS,'rect');
    outer.setAttribute('class','computeDeviceBezel');
    outer.setAttribute('x','686'); outer.setAttribute('y','141');
    outer.setAttribute('width','458'); outer.setAttribute('height','313');
    outer.setAttribute('rx','21');
    outer.setAttribute('fill','none');
    outer.setAttribute('stroke','#1d2f40');
    outer.setAttribute('stroke-width','8');
    outer.setAttribute('pointer-events','none');

    const edge=doc.createElementNS(NS,'rect');
    edge.setAttribute('x','689'); edge.setAttribute('y','144');
    edge.setAttribute('width','452'); edge.setAttribute('height','307');
    edge.setAttribute('rx','17');
    edge.setAttribute('fill','none');
    edge.setAttribute('stroke','rgba(154,184,204,.42)');
    edge.setAttribute('stroke-width','1.4');
    edge.setAttribute('pointer-events','none');

    panel.insertAdjacentElement('afterend',outer);
    outer.insertAdjacentElement('afterend',edge);
  }

  units.forEach((unit,i)=>{
    const card=unit.querySelector('.worker-card');
    const chip=doc.createElementNS(NS,'image');
    chip.setAttribute('class','realWorkerChip');
    chip.setAttribute('href',CHIP);
    chip.setAttribute('x',String(xs[i]));
    chip.setAttribute('y','326');
    chip.setAttribute('width','88');
    chip.setAttribute('height','76');
    chip.setAttribute('preserveAspectRatio','xMidYMid slice');
    chip.setAttribute('style','clip-path:inset(0 round 10px);pointer-events:none');
    if(card) unit.insertBefore(chip,card.nextSibling);
    const label=unit.querySelector('text');
    if(label) label.style.display='none';
    const dot=unit.querySelector('circle.worker-dot');
    if(dot){
      dot.setAttribute('cx',String(xs[i]+44));
      dot.setAttribute('cy','326');
      dot.setAttribute('r','6');
      unit.appendChild(dot);
    }
  });
});
</script>
</body></html>
