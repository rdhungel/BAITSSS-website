<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAITSSS Animation Chip Test</title><style>html,body{margin:0;background:#07131f}iframe{display:block;width:100%;height:720px;border:0;background:#07131f}</style></head>
<body>
<iframe id="preview" src="/animation-evaluation.html" title="BAITSSS animation realistic worker chips"></iframe>
<script>
const CHIP='/assets/worker-chip-board.webp?v=1';
const SAT_ATMOS='/assets/published-science/Satellite%20atmos.png?v=1';
const CENTER_PIVOTS=[
  '/assets/published-science/center1.png?v=1',
  '/assets/published-science/center2.png?v=1',
  '/assets/published-science/center3.png?v=1',
  '/assets/published-science/center4.png?v=1'
];
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const units=doc && [...doc.querySelectorAll('#workers .workerUnit')];
  if(!doc || !units || units.length!==4 || doc.querySelectorAll('.realWorkerChip').length) return;
  const NS='http://www.w3.org/2000/svg';
  const xs=[716,818,920,1022];

  const topbarBlock=doc.querySelector('.topbar-block');
  if(topbarBlock) topbarBlock.style.display='none';

  const legend=doc.querySelector('.legend');
  if(legend) legend.style.display='none';
  const review=doc.querySelector('.review');
  if(review) review.style.display='none';
  doc.documentElement.style.minHeight='0';
  doc.body.style.minHeight='0';
  doc.body.style.padding='0';
  doc.body.style.margin='0';
  const heroShell=doc.querySelector('.hero');
  if(heroShell){
    heroShell.style.margin='0 auto';
    heroShell.style.maxWidth='1180px';
  }
  const outerFrame=doc.querySelector('.frame');
  if(outerFrame){
    outerFrame.style.border='0';
    outerFrame.style.borderRadius='0';
    outerFrame.style.background='#07131f';
    outerFrame.style.overflow='hidden';
  }

  const svg=doc.querySelector('svg');
  if(svg) svg.setAttribute('viewBox','0 20 1180 640');

  const architectureLabel=[...doc.querySelectorAll('text')].find(t=>t.textContent.trim()==='WORKING IT OUT');
  if(architectureLabel) architectureLabel.textContent='BAITSSS DESKTOP ARCHITECTURE';

  const satThumb=doc.getElementById('satThumb');
  if(satThumb) satThumb.style.display='none';
  const topSatellitePanel=[...doc.querySelectorAll('rect')].find(r=>
    r.getAttribute('x')==='40' && r.getAttribute('y')==='28' &&
    r.getAttribute('width')==='1100' && r.getAttribute('height')==='90'
  );
  if(topSatellitePanel) topSatellitePanel.setAttribute('height','72');

  const inBadge=doc.getElementById('inBadge');
  if(inBadge){
    const badgeRect=inBadge.querySelector('rect');
    if(badgeRect) badgeRect.style.display='none';
    const badgeText=inBadge.querySelector('text');
    if(badgeText){
      badgeText.textContent='NLDAS WEATHER INPUT';
      badgeText.setAttribute('x','40');
      badgeText.setAttribute('y','133');
      badgeText.setAttribute('text-anchor','start');
      badgeText.setAttribute('dominant-baseline','middle');
      badgeText.setAttribute('style','font-size:16px;font-weight:800;letter-spacing:0;fill:#f4f7fa');
    }
  }

  const through1=doc.getElementById('through1');
  if(svg && through1 && !doc.querySelector('.satAtmosFieldVisual')){
    const defs=svg.querySelector('defs');
    const clip=doc.createElementNS(NS,'clipPath');
    clip.setAttribute('id','satAtmosFieldClip');
    const clipRect=doc.createElementNS(NS,'rect');
    clipRect.setAttribute('x','40'); clipRect.setAttribute('y','145');
    clipRect.setAttribute('width','610'); clipRect.setAttribute('height','305');
    clipRect.setAttribute('rx','18');
    clip.appendChild(clipRect);
    if(defs) defs.appendChild(clip);

    const visual=doc.createElementNS(NS,'image');
    visual.setAttribute('class','satAtmosFieldVisual');
    visual.setAttribute('href',SAT_ATMOS);
    visual.setAttribute('x','40'); visual.setAttribute('y','145');
    visual.setAttribute('width','610'); visual.setAttribute('height','305');
    visual.setAttribute('preserveAspectRatio','xMidYMin slice');
    visual.setAttribute('clip-path','url(#satAtmosFieldClip)');
    visual.setAttribute('pointer-events','none');
    through1.parentNode.insertBefore(visual,through1);

    const border=doc.createElementNS(NS,'rect');
    border.setAttribute('x','40'); border.setAttribute('y','145');
    border.setAttribute('width','610'); border.setAttribute('height','305');
    border.setAttribute('rx','18');
    border.setAttribute('fill','none');
    border.setAttribute('stroke','rgba(201,238,130,.28)');
    border.setAttribute('stroke-width','1.5');
    border.setAttribute('pointer-events','none');
    through1.parentNode.insertBefore(border,through1);
  }

  if(svg && through1 && !doc.querySelector('.weatherEntrySources')){
    const sources=doc.createElementNS(NS,'g');
    sources.setAttribute('class','weatherEntrySources');
    sources.setAttribute('pointer-events','none');
    sources.setAttribute('opacity','1');
    const addPath=(g,d,color,w='2.3')=>{const p=doc.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');g.appendChild(p);};

    let g=doc.createElementNS(NS,'g');
    addPath(g,'M59 273 C63 278 65 281 65 284 A6 6 0 0 1 53 284 C53 281 55 278 59 273 Z','#C8F4FF','2.4');
    sources.appendChild(g);

    g=doc.createElementNS(NS,'g');
    let c=doc.createElementNS(NS,'circle'); c.setAttribute('cx','57'); c.setAttribute('cy','314'); c.setAttribute('r','3.5'); c.setAttribute('fill','none'); c.setAttribute('stroke','#FFF176'); c.setAttribute('stroke-width','2.4'); g.appendChild(c);
    [[57,306,57,309],[57,319,57,322],[49,314,52,314],[62,314,65,314],[51.5,308.5,53.5,310.5],[60.5,317.5,62.5,319.5],[62.5,308.5,60.5,310.5],[53.5,317.5,51.5,319.5]].forEach(p=>{const l=doc.createElementNS(NS,'line');l.setAttribute('x1',p[0]);l.setAttribute('y1',p[1]);l.setAttribute('x2',p[2]);l.setAttribute('y2',p[3]);l.setAttribute('stroke','#FFF176');l.setAttribute('stroke-width','2.3');l.setAttribute('stroke-linecap','round');g.appendChild(l);});
    sources.appendChild(g);

    g=doc.createElementNS(NS,'g');
    addPath(g,'M49 342 H60 C63 342 65 340.5 65 339','#D2FFF5','2.4');
    addPath(g,'M49 346 H61 C64 346 65 347.5 63 349','#D2FFF5','2.4');
    addPath(g,'M49 350 H57','#D2FFF5','2.4');
    sources.appendChild(g);

    g=doc.createElementNS(NS,'g');
    addPath(g,'M59 369 V379 A4 4 0 1 0 65 379 V369 A3 3 0 0 0 59 369 Z','#F1E3FF','2.4');
    addPath(g,'M62 372 V382','#F1E3FF','2.4');
    sources.appendChild(g);

    through1.parentNode.insertBefore(sources,through1);
    ['n1','n2','n3','n4'].forEach(id=>{
      const dot=doc.getElementById(id);
      if(dot) through1.parentNode.insertBefore(dot,through1);
    });
  }

  const resultPanel=doc.querySelector('.result-panel');
  const resultGrid=doc.getElementById('resultGrid');
  const resultBar=doc.getElementById('resultBar');
  const resultPct=doc.getElementById('resultPct');
  if(resultPanel && resultGrid && resultBar && resultPct && !doc.querySelector('.resultLayoutExpanded')){
    resultPanel.classList.add('resultLayoutExpanded');
    resultPanel.setAttribute('x','694');
    resultPanel.setAttribute('y','486');
    resultPanel.setAttribute('width','436');
    resultPanel.setAttribute('height','166');
    resultPanel.setAttribute('rx','16');

    const texts=[...doc.querySelectorAll('text')];
    const title=texts.find(t=>t.textContent.trim()==='YOUR WATER-USE REPORT');
    const scaleLabel=texts.find(t=>t.textContent.trim()==='WATER YOUR FIELD USED, LOW → HIGH ACROSS THE FIELD');
    const downloadLabel=texts.find(t=>t.textContent.trim()==='YOU GET: A MAP + REPORT YOU CAN DOWNLOAD, EVERY DAY');
    if(title){ title.setAttribute('x','912'); title.setAttribute('y','507'); }
    resultPct.setAttribute('x','1098'); resultPct.setAttribute('y','511');
    if(scaleLabel) scaleLabel.style.display='none';
    if(downloadLabel) downloadLabel.style.display='none';

    const barTrack=[...doc.querySelectorAll('rect')].find(r=>
      r!==resultBar && r.getAttribute('x')==='752' && r.getAttribute('y')==='550' && r.getAttribute('width')==='336' && r.getAttribute('height')==='9'
    );
    if(barTrack){ barTrack.setAttribute('x','717'); barTrack.setAttribute('y','525'); barTrack.setAttribute('width','336'); }
    resultBar.setAttribute('x','717'); resultBar.setAttribute('y','525');

    const tiles=[...resultGrid.querySelectorAll('.result-tile')];
    const squareX=[724,818,912,1006];
    const squareY=550, squareSize=78;
    const squareForTile=[0,0,1,1,2,2,3];
    tiles.forEach((tile,i)=>{
      const s=squareForTile[i];
      tile.setAttribute('x',String(squareX[s]));
      tile.setAttribute('y',String(squareY));
      tile.setAttribute('width',String(squareSize));
      tile.setAttribute('height',String(squareSize));
      tile.setAttribute('rx','8');
    });

    const defs=svg && svg.querySelector('defs');
    if(defs && !doc.querySelector('.resultPivotPreviews')){
      const pivotPreviews=doc.createElementNS(NS,'g');
      pivotPreviews.setAttribute('class','resultPivotPreviews');
      pivotPreviews.setAttribute('pointer-events','none');
      squareX.forEach((x,i)=>{
        const clipId='resultPivotClip'+(i+1);
        const pivotClip=doc.createElementNS(NS,'clipPath');
        pivotClip.setAttribute('id',clipId);
        const pivotClipRect=doc.createElementNS(NS,'rect');
        pivotClipRect.setAttribute('x',String(x));
        pivotClipRect.setAttribute('y',String(squareY));
        pivotClipRect.setAttribute('width',String(squareSize));
        pivotClipRect.setAttribute('height',String(squareSize));
        pivotClipRect.setAttribute('rx','8');
        pivotClip.appendChild(pivotClipRect);
        defs.appendChild(pivotClip);

        const pivotImage=doc.createElementNS(NS,'image');
        pivotImage.setAttribute('href',CENTER_PIVOTS[i]);
        pivotImage.setAttribute('x',String(x));
        pivotImage.setAttribute('y',String(squareY));
        pivotImage.setAttribute('width',String(squareSize));
        pivotImage.setAttribute('height',String(squareSize));
        pivotImage.setAttribute('preserveAspectRatio','xMidYMid slice');
        pivotImage.setAttribute('clip-path','url(#'+clipId+')');
        pivotPreviews.appendChild(pivotImage);
      });
      resultGrid.appendChild(pivotPreviews);
    }

    const frames=doc.createElementNS(NS,'g');
    frames.setAttribute('class','resultSquareFrames');
    frames.setAttribute('pointer-events','none');
    squareX.forEach(x=>{
      const r=doc.createElementNS(NS,'rect');
      r.setAttribute('x',String(x)); r.setAttribute('y',String(squareY));
      r.setAttribute('width',String(squareSize)); r.setAttribute('height',String(squareSize));
      r.setAttribute('rx','8'); r.setAttribute('fill','none');
      r.setAttribute('stroke','rgba(202,167,255,.34)'); r.setAttribute('stroke-width','1.2');
      frames.appendChild(r);
    });
    resultGrid.appendChild(frames);
  }

  const panel=[...doc.querySelectorAll('rect')].find(r=>r.getAttribute('x')==='690'&&r.getAttribute('y')==='145'&&r.getAttribute('width')==='450'&&r.getAttribute('height')==='305');
  if(svg && panel && !doc.querySelector('.computeDeviceBezel')){
    const outer=doc.createElementNS(NS,'rect');
    outer.setAttribute('class','computeDeviceBezel');
    outer.setAttribute('x','686'); outer.setAttribute('y','141');
    outer.setAttribute('width','458'); outer.setAttribute('height','313');
    outer.setAttribute('rx','21');
    outer.setAttribute('fill','none');
    outer.setAttribute('stroke','#1d2f40');
    outer.setAttribute('stroke-width','8');
    outer.setAttribute('pointer-events','none');

    const edge=doc.createElementNS(NS,'rect');
    edge.setAttribute('x','689'); edge.setAttribute('y','144');
    edge.setAttribute('width','452'); edge.setAttribute('height','307');
    edge.setAttribute('rx','17');
    edge.setAttribute('fill','none');
    edge.setAttribute('stroke','rgba(154,184,204,.42)');
    edge.setAttribute('stroke-width','1.4');
    edge.setAttribute('pointer-events','none');

    panel.insertAdjacentElement('afterend',outer);
    outer.insertAdjacentElement('afterend',edge);
  }

  units.forEach((unit,i)=>{
    const card=unit.querySelector('.worker-card');
    const chip=doc.createElementNS(NS,'image');
    chip.setAttribute('class','realWorkerChip');
    chip.setAttribute('href',CHIP);
    chip.setAttribute('x',String(xs[i]));
    chip.setAttribute('y','326');
    chip.setAttribute('width','88');
    chip.setAttribute('height','76');
    chip.setAttribute('preserveAspectRatio','xMidYMid slice');
    chip.setAttribute('style','clip-path:inset(0 round 10px);pointer-events:none');
    if(card) unit.insertBefore(chip,card.nextSibling);
    const label=unit.querySelector('text');
    if(label) label.style.display='none';
    const dot=unit.querySelector('circle.worker-dot');
    if(dot){
      dot.setAttribute('cx',String(xs[i]+44));
      dot.setAttribute('cy','326');
      dot.setAttribute('r','6');
      unit.appendChild(dot);
    }
  });

  requestAnimationFrame(()=>{
    const hero=doc.querySelector('.hero');
    if(hero){
      const h=Math.ceil(hero.getBoundingClientRect().height);
      frame.style.height=h+'px';
    }
  });
});
</script>
</body></html>
