<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAITSSS animation visual clarity test 1</title>
<style>
html,body{margin:0;background:#07131f;color:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding:18px}
.wrap{max-width:1212px;margin:0 auto}
.note{font-size:12px;color:#8ea1b2;margin:0 0 10px 2px;letter-spacing:.02em}
iframe{display:block;width:100%;height:980px;border:0;background:#07131f;border-radius:18px}
@media(max-width:760px){body{padding:8px}.note{font-size:10px}iframe{height:920px}}
</style>
</head>
<body>
<div class="wrap">
<p class="note">VISUAL CLARITY TEST 1 · original animation logic remains untouched</p>
<iframe id="preview" src="/animation-evaluation.html" title="BAITSSS animation visual clarity test"></iframe>
</div>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const svg=doc && doc.querySelector('svg');
  if(!svg || svg.querySelector('#clarityTest1')) return;
  const NS='http://www.w3.org/2000/svg';
  const g=doc.createElementNS(NS,'g');
  g.id='clarityTest1';
  g.setAttribute('aria-hidden','true');
  g.setAttribute('pointer-events','none');
  g.innerHTML=`
    <g opacity="0.12" transform="translate(430 150) scale(2.05)" stroke="#a8c7da" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="52" y="15" width="22" height="26" rx="4" stroke-width="1.4"/>
      <rect x="4" y="13" width="40" height="30" rx="2" stroke-width="1.2"/>
      <path d="M10 19h28M10 27h28M10 35h28M17 13v30M30 13v30" stroke-width=".65"/>
      <rect x="82" y="13" width="40" height="30" rx="2" stroke-width="1.2"/>
      <path d="M88 19h28M88 27h28M88 35h28M95 13v30M108 13v30" stroke-width=".65"/>
      <path d="M44 28h8M74 28h8" stroke-width="1.3"/>
      <circle cx="63" cy="28" r="5" stroke-width="1.2"/>
      <path d="M58 42l-12 35M68 42l25 35" stroke-width=".8" stroke-dasharray="3 4"/>
    </g>
    <path d="M548 238 L435 335 M600 238 L505 335" fill="none" stroke="rgba(168,199,218,.12)" stroke-width="1.4" stroke-dasharray="5 7"/>
    <g opacity="0.085" transform="translate(838 158)">
      <rect x="0" y="0" width="128" height="96" rx="16" fill="none" stroke="#87d7cf" stroke-width="2"/>
      <rect x="34" y="22" width="60" height="52" rx="8" fill="none" stroke="#87d7cf" stroke-width="2"/>
      <path d="M14 16h20M14 32h20M14 48h20M14 64h20M14 80h20M94 16h20M94 32h20M94 48h20M94 64h20M94 80h20M48 8v14M64 8v14M80 8v14M48 74v14M64 74v14M80 74v14" stroke="#87d7cf" stroke-width="1.4"/>
      <path d="M46 49h36M64 31v36M52 37l24 24M76 37L52 61" stroke="#c9ee82" stroke-width="1.2"/>
    </g>
  `;
  const defs=svg.querySelector('defs');
  if(defs && defs.nextSibling) svg.insertBefore(g,defs.nextSibling); else svg.insertBefore(g,svg.firstChild);
});
</script>
</body>
</html>
