name: Consolidate page identities

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/consolidate-page-identity.yml
      - .github/scripts/consolidate_page_identity.py

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Consolidate page identities
        run: python .github/scripts/consolidate_page_identity.py
      - name: Commit consolidation
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add science/index.html software/index.html faq/index.html access-participation/index.html meet-the-team/index.html
          git commit -m "Consolidate public page identities"
          git push origin gh-pages
