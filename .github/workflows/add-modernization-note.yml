name: Add BAITSSS Desktop modernization note

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  add-note:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Insert modernization note
        shell: python
        run: |
          from pathlib import Path
          p = Path('capabilities/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '''</div></div></section>\n\n<section class="section"><div class="wrap"><div class="section-head"><div class="kicker">Field, projects and data</div>'''
          block = '''</div></div></section>\n\n<section class="section" aria-labelledby="modernization-title"><div class="wrap"><div class="section-head"><div class="kicker">BAITSSS Desktop V1</div><div><div class="status">First public release</div><h2 id="modernization-title">A modern desktop environment built around the established BAITSSS science.</h2><p class="section-intro">BAITSSS Desktop V1 brings the BAITSSS scientific model into a complete Windows application that keeps project setup, data preparation, model execution, Results, and scientific export in one connected workflow.</p><p class="section-intro">The modernization was built around several priorities at the same time: preserving the underlying science, making the software easier to use, supporting different fields and simulation periods, improving computational efficiency, keeping projects and Results reproducible, and creating a cleaner software architecture for continued development.</p><p class="section-intro">Input data, project settings, simulation state, completed runs, maps, time series, and exports remain connected within the same project environment. The result is a more usable, versatile, organized, and maintainable platform for research, field-scale analysis, education, model evaluation, and collaborative scientific work.</p></div></div></div></section>\n\n<section class="section"><div class="wrap"><div class="section-head"><div class="kicker">Field, projects and data</div>'''
          if 'id="modernization-title"' not in s:
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              s = s.replace(marker, block, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit modernization note
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capabilities/index.html
          git commit -m "Add BAITSSS Desktop V1 modernization note"
          git push origin gh-pages
