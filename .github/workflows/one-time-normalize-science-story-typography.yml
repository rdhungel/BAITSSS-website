name: Normalize Science story typography
on:
  push:
    paths:
      - '.github/workflows/one-time-normalize-science-story-typography.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Normalize narrative body typography
        shell: python
        run: |
          from pathlib import Path
          p = Path('science/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.story-lead{font-size:20px!important;line-height:1.68!important;color:#dce8f2!important}'
          new = '.story-lead{color:#dce8f2!important}'
          if old not in s:
              raise SystemExit('Expected story-lead typography rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-normalize-science-story-typography.yml
      - name: Commit update
        run: |
          git config user.name "rdhungel"
          git config user.email "dhun9265@gmail.com"
          git add science/index.html .github/workflows/one-time-normalize-science-story-typography.yml
          git commit -m "Normalize Science narrative typography"
          git push origin gh-pages
