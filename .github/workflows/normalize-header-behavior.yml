name: Normalize header behavior

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/normalize-header-behavior.yml'

permissions:
  contents: write

jobs:
  normalize-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Apply one header behavior across public pages
        shell: python
        run: |
          from pathlib import Path
          import re

          css = '''
<style id="global-header-stability">
.site-header{height:64px!important;min-height:64px!important;padding:0 24px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:22px!important;position:sticky!important;top:0!important;z-index:100!important;overflow:visible!important}
.site-header .brand{display:flex!important;align-items:center!important;gap:10px!important;flex:0 0 auto!important;white-space:nowrap!important;font-size:21px!important}
.site-header .brand img{width:32px!important;height:36px!important;object-fit:contain!important}
.site-header .primary-nav{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:22px!important;flex:0 0 auto!important;position:static!important;opacity:1!important;pointer-events:auto!important;transform:none!important;padding:0!important;border:0!important;background:transparent!important}
.site-header .primary-nav>a,.site-header .more summary{display:block!important;width:auto!important;padding:6px 0!important;font-size:14px!important;line-height:1.2!important;font-weight:600!important;white-space:nowrap!important}
.site-header .more{position:relative!important;width:auto!important;flex:0 0 auto!important}
.site-header .more-menu{position:absolute!important;right:0!important;top:34px!important;width:260px!important}
.site-header .nav-toggle{display:none!important}
@media(max-width:1180px) and (min-width:901px){
  .site-header{padding:0 16px!important;gap:14px!important}
  .site-header .primary-nav{gap:14px!important}
  .site-header .primary-nav>a,.site-header .more summary{font-size:13px!important}
  .site-header .brand{font-size:19px!important}
}
@media(max-width:900px){
  .site-header{padding:0 14px!important}
  .site-header .brand{font-size:18px!important}
  .site-header .nav-toggle{display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important}
  .site-header .primary-nav{position:fixed!important;top:64px!important;left:0!important;right:0!important;width:100%!important;background:#07131f!important;border-bottom:1px solid rgba(255,255,255,.08)!important;flex-direction:column!important;align-items:flex-start!important;gap:2px!important;padding:10px 20px 18px!important;transform:translateY(-8px)!important;opacity:0!important;pointer-events:none!important;transition:opacity .16s ease,transform .16s ease!important}
  .site-header .primary-nav[data-open="true"]{transform:translateY(0)!important;opacity:1!important;pointer-events:auto!important}
  .site-header .primary-nav>a,.site-header .more{width:100%!important}
  .site-header .primary-nav>a,.site-header .more summary{width:100%!important;padding:12px 4px!important;font-size:14px!important}
  .site-header .more-menu{position:static!important;width:100%!important;margin:2px 0 6px!important}
}
</style>
'''

          marker = re.compile(r'\n?<style id="global-header-stability">.*?</style>\n?', re.S)
          changed=[]
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts or path.as_posix() == 'development-status/index.html':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'class="site-header"' not in text or 'id="primaryNav"' not in text:
                  continue
              text2 = marker.sub('\n', text)
              if '</head>' not in text2:
                  continue
              text2 = text2.replace('</head>', css + '</head>', 1)
              if text2 != text:
                  path.write_text(text2, encoding='utf-8')
                  changed.append(path.as_posix())
          print('Normalized header behavior in', len(changed), 'pages')
          for p in changed:
              print(p)
      - name: Commit normalized header behavior
        run: |
          if git diff --quiet; then
            echo "Header behavior already consistent."
            exit 0
          fi
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Normalize header behavior across website"
          git push origin gh-pages
