name: Normalize header behavior

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/normalize-header-behavior.yml

permissions:
  contents: write

jobs:
  normalize-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add shared header stylesheet to every public page
        run: |
          if grep -q 'class="site-header"' index.html; then
            sed -i '/site-header.css/d' index.html
            sed -i 's#</head>#<link rel="stylesheet" href="assets/site-header.css">\n</head>#' index.html
          fi
          for f in */index.html; do
            if [ "$f" = "development-status/index.html" ]; then
              continue
            fi
            if grep -q 'class="site-header"' "$f"; then
              sed -i '/site-header.css/d' "$f"
              sed -i 's#</head>#<link rel="stylesheet" href="../assets/site-header.css">\n</head>#' "$f"
            fi
          done
      - name: Commit stable header behavior
        run: |
          if git diff --quiet; then
            echo "Header links already consistent."
            exit 0
          fi
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Use one stable header behavior across website"
          git push origin gh-pages
