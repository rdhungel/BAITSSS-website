name: Normalize header behavior

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/normalize-header-behavior.yml

permissions:
  contents: write

jobs:
  normalize-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add shared header stylesheet to top navigation pages
        run: |
          sed -i '/site-header.css/d' index.html
          sed -i 's#</head>#<link rel="stylesheet" href="assets/site-header.css">\n</head>#' index.html
          for f in software/index.html capabilities/index.html science/index.html research-education/index.html access-participation/index.html contact/index.html; do
            sed -i '/site-header.css/d' "$f"
            sed -i 's#</head>#<link rel="stylesheet" href="../assets/site-header.css">\n</head>#' "$f"
          done
      - name: Commit stable header behavior
        run: |
          if git diff --quiet; then
            echo "Header links already consistent."
            exit 0
          fi
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html software/index.html capabilities/index.html science/index.html research-education/index.html access-participation/index.html contact/index.html
          git commit -m "Use one stable header behavior on top navigation pages"
          git push origin gh-pages
