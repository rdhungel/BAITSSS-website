name: Add Home FAQ and Contact
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/add-home-faq-contact.py'
      - '.github/workflows/add-home-faq-contact.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add-home-faq-contact.py
      - run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add FAQ and Contact closing section to Home"
          git push origin gh-pages
