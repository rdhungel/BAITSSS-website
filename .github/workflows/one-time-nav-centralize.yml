name: One-time centralize BAITSSS navigation

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/one-time-nav-centralize.yml'

permissions:
  contents: write

jobs:
  centralize-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Transform all header pages
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/site-nav.js
          echo '' | base64 -d > /tmp/transform.py
          python /tmp/transform.py
      - name: Verify single navigation authority
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/verify.py
          python /tmp/verify.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "BAITSSS Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Centralize mobile navigation authority"
          git push origin gh-pages
