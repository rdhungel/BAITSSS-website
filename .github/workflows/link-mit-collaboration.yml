name: Link MIT collaboration

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/link-mit-collaboration.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Link graduate research card to MIT collaboration
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          phrase = 'Higher-resolution data for irrigation management'
          target = None
          for p in Path('.').rglob('*.html'):
              t = p.read_text(encoding='utf-8')
              if phrase in t or 'MIT STUDENT COLLABORATION' in t or 'MIT Student Collaboration' in t:
                  target = p
                  break
          if target is None:
              raise SystemExit('MIT collaboration page not found')

          t = target.read_text(encoding='utf-8')
          if 'id="mit-collaboration"' not in t:
              pos = t.find(phrase)
              if pos == -1:
                  pos = t.find('MIT STUDENT COLLABORATION')
              start = t.rfind('<article', 0, pos)
              if start == -1:
                  start = t.rfind('<section', 0, pos)
              if start == -1:
                  raise SystemExit('MIT collaboration block start not found')
              end = t.find('>', start)
              t = t[:end] + ' id="mit-collaboration"' + t[end:]
              target.write_text(t, encoding='utf-8')

          src = Path('research-education/index.html')
          s = src.read_text(encoding='utf-8')
          card_anchor = '<article class="card"><div class="tag">GRADUATE RESEARCH</div><h3>MS and PhD investigation</h3><p>Graduate students can examine model assumptions, sensitivity, spatial variability, irrigation scenarios, independent observations, and scientific limitations without first constructing the full application framework.</p>'
          if card_anchor not in s:
              raise SystemExit('Graduate research card not found')

          target_dir = '/' + str(target.parent).replace('\\','/').strip('./') + '/'
          link = f'<p style="margin-top:14px"><a href="..{target_dir}#mit-collaboration" style="color:var(--accent);font-weight:700;text-decoration:none">MIT collaboration</a></p>'
          s = re.sub(r'<p style="margin-top:14px"><a[^>]*>MIT collaboration</a></p>', '', s)
          s = s.replace(card_anchor, card_anchor + link, 1)
          src.write_text(s, encoding='utf-8')
          print(f'Linked to {target}')
          PY
      - name: Commit
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Link graduate research to MIT collaboration example"
          git push origin gh-pages
