name: Final terminology cleanup
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/final-terminology-cleanup.py'
      - '.github/workflows/final-terminology-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/final-terminology-cleanup.py
      - run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html hero-runtime-prototype.html animation-evaluation.html faq/index.html meet-the-team/index.html system-requirements/index.html research-map/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finish BAITSSS model and Desktop terminology cleanup"
          git push origin gh-pages
