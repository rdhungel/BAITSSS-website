name: Refresh homepage animation intro once
on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Force new animation cache identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'animation-evaluation-chip-test.html?v=homepage-workflow-20260907-architecture-heading-18px-1'
          new = 'animation-evaluation-chip-test.html?v=model-to-desktop-intro-20260908-1'
          if old not in s:
              raise SystemExit('Expected homepage animation URL not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/refresh-animation-intro-once.yml').unlink()
          PY
      - name: Commit homepage cache refresh
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/refresh-animation-intro-once.yml
          git commit -m "Load model-to-desktop intro on homepage"
          git push origin gh-pages
