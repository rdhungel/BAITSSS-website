name: Refresh page cache policy

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/refresh-page-cache-policy.yml

permissions:
  contents: write

jobs:
  refresh-cache-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add anti-stale cache metadata to public HTML
        run: |
          for f in index.html */index.html; do
            [ -f "$f" ] || continue
            if grep -q '<meta http-equiv="Cache-Control"' "$f"; then
              continue
            fi
            sed -i 's#<meta name="viewport" content="width=device-width,initial-scale=1">#<meta name="viewport" content="width=device-width,initial-scale=1">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">#' "$f"
          done
      - name: Commit cache policy
        run: |
          if git diff --quiet; then
            echo "Cache policy already present."
            exit 0
          fi
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Prevent stale page headers during site updates"
          git push origin gh-pages
