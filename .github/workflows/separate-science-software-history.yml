name: Separate science and software history
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/separate_science_software_history.py'
      - '.github/workflows/separate-science-software-history.yml'
permissions:
  contents: write
jobs:
  separate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Separate scientific and software history
        run: python .github/scripts/separate_science_software_history.py
      - name: Commit history separation
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' '*/*.html' SITE_CONTENT_AUTHORITY.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Separate scientific and software history"
            git push origin gh-pages
          fi
