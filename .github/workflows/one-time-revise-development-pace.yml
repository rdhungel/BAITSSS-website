name: Revise development pace wording
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/one-time-revise-development-pace.yml']
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Update wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('capabilities/index.html')
          s = p.read_text(encoding='utf-8')
          old = "The spatial workflow reflects more than two months of concentrated modernization, integration, and validation. Most of the current Upper route advanced from station intake to this substantial end-to-end state in roughly two days of focused development. The evidence requirement remains the same: a capability is promoted only after its run authority, provenance, scientific outputs, and Results path are verified."
          new = "The spatial workflow reflects years of scientific development, difficult iteration, and continued refinement, brought into its present desktop form through an especially concentrated period of modernization and validation in 2026. Most of the current Upper route advanced from station intake to this substantial end-to-end state through a short period of focused development built on that much longer foundation. The evidence requirement remains unchanged: a capability is promoted only after its run authority, provenance, scientific outputs, and Results path are verified."
          if old not in s:
              raise SystemExit('Target wording not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-revise-development-pace.yml
      - name: Commit update
        run: |
          git config user.name "rdhungel"
          git config user.email "dhun9265@gmail.com"
          git add capabilities/index.html .github/workflows/one-time-revise-development-pace.yml
          git commit -m "Refine BAITSSS development history wording"
          git push origin gh-pages
