name: Fix MIT thesis link placement

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/fix-mit-thesis-link.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Move thesis link to MIT collaboration card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          thesis = 'https://www.proquest.com/openview/18bac26c309d72e79a33c5989278df50/1?cbl=18750&diss=y&pq-origsite=gscholar'

          re_page = Path('research-education/index.html')
          s = re_page.read_text(encoding='utf-8')
          s = re.sub(r'<p style="margin-top:14px"><a href="https://www\.proquest\.com/openview/18bac26c309d72e79a33c5989278df50/1\?cbl=18750&amp;diss=y&amp;pq-origsite=gscholar"[^>]*>MIT thesis example: Sydney Wickman, 2024 →</a></p>', '', s)
          s = re.sub(r'<p style="margin-top:14px"><a href="https://www\.proquest\.com/openview/18bac26c309d72e79a33c5989278df50/1\?cbl=18750&diss=y&pq-origsite=gscholar"[^>]*>MIT thesis example: Sydney Wickman, 2024 →</a></p>', '', s)
          re_page.write_text(s, encoding='utf-8')

          target = None
          for p in Path('.').rglob('*.html'):
              t = p.read_text(encoding='utf-8')
              if 'Higher-resolution data for irrigation management' in t:
                  target = p
                  break
          if target is None:
              raise SystemExit('MIT collaboration section not found')

          t = target.read_text(encoding='utf-8')
          repl = f'<a href="{thesis}" target="_blank" rel="noopener">MIT thesis record ↗</a>'
          t2, n = re.subn(r'<a[^>]*>\s*MIT thesis record[^<]*</a>', repl, t, count=1)
          if n == 0:
              if 'MIT thesis record ↗' in t:
                  t2 = t.replace('MIT thesis record ↗', repl, 1)
              elif 'MIT thesis record' in t:
                  t2 = t.replace('MIT thesis record', repl, 1)
              else:
                  raise SystemExit('MIT thesis record label not found')
          target.write_text(t2, encoding='utf-8')
          print(f'Updated {target}')
          PY
      - name: Commit
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep thesis link within MIT collaboration example"
          git push origin gh-pages
