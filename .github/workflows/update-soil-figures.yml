name: Update soil figures

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/update-soil-figures.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Update Published Science soil figures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('published-science/index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
.soil-pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.soil-pair .study{overflow:hidden}.soil-pair a{display:block;background:var(--soft);border-bottom:1px solid var(--line);padding:14px}.soil-pair img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;margin:0 auto}.soil-summary{margin-top:18px}@media(max-width:900px){.soil-pair{grid-template-columns:1fr}.soil-pair img{max-height:none}}
'''
          if '.soil-pair{' not in s:
              s = s.replace('@media(max-width:1100px)', css + '@media(max-width:1100px)', 1)

          start = s.find('<section class="section" id="soil-heterogeneity">')
          end = s.find('</main>', start)
          if start == -1 or end == -1:
              raise SystemExit('Soil heterogeneity section not found')

          block = '''<section class="section" id="soil-heterogeneity"><div class="wrap">
<div class="section-head"><h2>Soil heterogeneity and irrigation response</h2><p class="section-copy">BAITSSS can be used to examine how different soil representations influence soil-water behavior, evapotranspiration components, and modeled irrigation at the same location.</p></div>
<div class="soil-pair">
<article class="study"><a href="../assets/published-science/Soil%20Hetero.png"><img src="../assets/published-science/Soil%20Hetero.png" alt="POLARIS and SSURGO comparison of vegetation, evapotranspiration, soil water, precipitation, and irrigation response."></a><div class="body"><div class="year">Soil dataset comparison</div><h3>Soil water and evapotranspiration</h3><p>The vegetation trajectory is held in common while BAITSSS is evaluated with POLARIS and SSURGO soil representations.</p></div></article>
<article class="study"><a href="../assets/published-science/Soil%20Hetero%20irrigation.png"><img src="../assets/published-science/Soil%20Hetero%20irrigation.png" alt="Modeled irrigation comparison under POLARIS and SSURGO soil representations."></a><div class="body"><div class="year">Irrigation response</div><h3>Modeled irrigation comparison</h3><p>Different soil representations produce different modeled irrigation timing and frequency.</p></div></article>
</div>
<article class="study soil-summary"><div class="body"><div class="year">Interpretation</div><h3>Soil representation changes modeled water balance behavior</h3><p>Together, the figures show that differences in soil representation can propagate into different root-zone water behavior and irrigation response while the vegetation trajectory remains the same.</p></div></article>
</div></section>
'''
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add published-science/index.html
          git commit -m "Pair soil heterogeneity and irrigation figures" || exit 0
          git push origin gh-pages
