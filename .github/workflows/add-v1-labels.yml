name: Add BAITSSS Desktop V1 labels

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/add-v1-labels.yml

permissions:
  contents: write

jobs:
  add-v1-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Add release identity to page HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          software = Path('software/index.html')
          text = software.read_text(encoding='utf-8')
          old = '<div class="eyebrow"><span></span>Software</div><h1>One desktop scientific workflow.</h1>'
          new = '<div class="eyebrow"><span></span>Software</div><div style="margin:0 0 18px;color:#f4f7fa;font-size:16px;line-height:1.35;font-weight:800">BAITSSS Desktop V1 <span style="color:#9db0c2;font-weight:600">· First release version</span></div><h1>One desktop scientific workflow.</h1>'
          if old not in text:
              raise SystemExit('Software target text not found')
          software.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          old = '<p class="eyebrow">Inside BAITSSS Desktop</p>'
          new = '<p class="eyebrow">Inside BAITSSS Desktop V1</p>'
          if old not in text:
              raise SystemExit('Home target text not found')
          home.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit V1 labels
        run: |
          git config user.name "BAITSSS Website"
          git config user.email "actions@users.noreply.github.com"
          git add index.html software/index.html
          git commit -m "Add BAITSSS Desktop V1 release identity"
          git push origin gh-pages
