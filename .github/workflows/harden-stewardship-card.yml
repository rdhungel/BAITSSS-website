name: Harden stewardship card visibility
on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Harden stewardship block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('meet-the-team/index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.person{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;padding:30px;border:1px solid var(--line2);border-radius:15px;background:linear-gradient(150deg,rgba(201,238,130,.04),rgba(255,255,255,.012))}'
          new_css = '.person{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;padding:30px;border:1px solid var(--line2);border-radius:15px;background:linear-gradient(150deg,rgba(201,238,130,.04),rgba(255,255,255,.012))}.stewardship-card{display:grid!important;visibility:visible!important;opacity:1!important;min-height:260px!important;overflow:visible!important}'
          if old_css not in s:
              raise SystemExit('person CSS marker not found')
          s = s.replace(old_css, new_css, 1)
          old_html = '<article class="person"><div class="identity"><div class="label">Current development team</div>'
          new_html = '<article class="person stewardship-card" aria-label="BAITSSS scientific stewardship"><div class="identity"><div class="label">Current development team</div>'
          if old_html not in s:
              raise SystemExit('stewardship card marker not found')
          s = s.replace(old_html, new_html, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meet-the-team/index.html
          git commit -m "Keep scientific stewardship card visible"
          git push origin gh-pages