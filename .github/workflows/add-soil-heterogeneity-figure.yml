name: Add soil heterogeneity figure

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/add-soil-heterogeneity-figure.yml

permissions:
  contents: write

jobs:
  add-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add soil heterogeneity study block
        run: |
          python -c "from pathlib import Path; import base64; p=Path('published-science/index.html'); s=p.read_text(encoding='utf-8'); marker='<!-- soil-heterogeneity-study -->'; block=base64.b64decode('').decode(); p.write_text(s if marker in s else s.replace('</main>', block+'</main>', 1), encoding='utf-8')"
      - name: Commit figure integration
        run: |
          if git diff --quiet; then
            echo "Soil heterogeneity figure already present."
            exit 0
          fi
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add published-science/index.html
          git commit -m "Add soil heterogeneity figure to Published Science"
          git push origin gh-pages
