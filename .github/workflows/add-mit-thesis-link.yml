name: Add MIT thesis link

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/add-mit-thesis-link.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Add MIT thesis link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research-education/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<article class="card"><div class="tag">GRADUATE RESEARCH</div><h3>MS and PhD investigation</h3><p>Graduate students can examine model assumptions, sensitivity, spatial variability, irrigation scenarios, independent observations, and scientific limitations without first constructing the full application framework.</p></article>'
          new = '<article class="card"><div class="tag">GRADUATE RESEARCH</div><h3>MS and PhD investigation</h3><p>Graduate students can examine model assumptions, sensitivity, spatial variability, irrigation scenarios, independent observations, and scientific limitations without first constructing the full application framework.</p><p style="margin-top:14px"><a href="https://www.proquest.com/openview/18bac26c309d72e79a33c5989278df50/1?cbl=18750&diss=y&pq-origsite=gscholar" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:none">MIT thesis example: Sydney Wickman, 2024 →</a></p></article>'
          if old not in s:
              raise SystemExit('Graduate Research card not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add research-education/index.html
          git commit -m "Add MIT thesis example to Research and Education"
          git push origin gh-pages
