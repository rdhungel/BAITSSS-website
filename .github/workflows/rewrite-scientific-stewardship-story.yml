name: Rewrite Scientific Stewardship story
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/rewrite-scientific-stewardship-story.py'
      - '.github/workflows/rewrite-scientific-stewardship-story.yml'
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/rewrite-scientific-stewardship-story.py
      - run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add scientific-stewardship/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rewrite Scientific Stewardship as a scientific story"
          git push origin gh-pages
