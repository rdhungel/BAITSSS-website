name: Final semantic page identity cleanup

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/final-semantic-identity.yml
      - .github/scripts/final_semantic_identity.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Apply final semantic cleanup
        run: python .github/scripts/final_semantic_identity.py
      - name: Commit cleanup
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add research-education/index.html meet-the-team/index.html faq/index.html
          git commit -m "Complete semantic page identity cleanup"
          git push origin gh-pages
