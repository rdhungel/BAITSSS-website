name: Consolidate page identities pass 2

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/consolidate-page-identity-pass2.yml
      - .github/scripts/consolidate_page_identity_pass2.py

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Consolidate remaining page identities
        run: python .github/scripts/consolidate_page_identity_pass2.py
      - name: Commit consolidation
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add documentation/index.html access-participation/index.html origins-publications/index.html research-map/index.html scientific-stewardship/index.html example-project/index.html
          git commit -m "Tighten public page identity boundaries"
          git push origin gh-pages
