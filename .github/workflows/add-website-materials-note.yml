name: Add website materials note
on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Add materials note to homepage footer
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<footer><div class="wrap footer-inner"><span>© 2026 BAITSSS</span><span><a href="origins-publications/#published-studies">Published Science</a> · <a href="origins-publications/#research-geography">Research Geography &amp; Timeline</a> · <a href="documentation/">Documentation</a></span></div></footer>'
          new='<footer><div class="wrap footer-inner"><span>© 2026 BAITSSS</span><span><a href="origins-publications/#published-studies">Published Science</a> · <a href="origins-publications/#research-geography">Research Geography &amp; Timeline</a> · <a href="documentation/">Documentation</a></span><span style="flex-basis:100%;line-height:1.55">Materials published on the BAITSSS website may be used and shared for research, education, and other non-commercial purposes. When using material from this website, please acknowledge BAITSSS and include a link to the relevant BAITSSS webpage as the source.</span></div></footer>'
          if old not in s:
              raise SystemExit('Footer marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add website materials use and citation note"
          git push origin gh-pages