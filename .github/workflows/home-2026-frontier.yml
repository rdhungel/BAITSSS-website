name: Add homepage 2026 research frontier

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add front-page 2026 ET and water research framing
        shell: python
        run: |
          from pathlib import Path

          page = Path('index.html')
          text = page.read_text(encoding='utf-8')

          if 'ET and agricultural water research in 2026' not in text:
              css_anchor = '.desktop-preview{padding:62px 0 66px;'
              css = '''.frontier-2026{padding:52px 0 56px;border-bottom:1px solid var(--line);background:#07131f}.frontier-2026-head{display:grid;grid-template-columns:230px minmax(0,1fr);gap:38px;margin-bottom:26px}.frontier-2026-title{font-size:34px;line-height:1.16;margin:0 0 12px}.frontier-2026-intro{max-width:900px;color:#dbe7f2;font-size:17px;line-height:1.66}.frontier-2026-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.frontier-2026-card{padding:24px;border:1px solid var(--line-strong);border-radius:14px;background:#0a1928}.frontier-2026-card .label{margin-bottom:12px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.frontier-2026-card h3{font-size:20px;line-height:1.3;margin-bottom:10px}.frontier-2026-card p{color:var(--text-dim);font-size:14.5px;line-height:1.65}.frontier-2026-note{margin-top:18px;padding:20px 22px;border-left:3px solid var(--accent);background:rgba(201,238,130,.035);color:#dbe7f2;font-size:15.5px;line-height:1.65}.frontier-2026-link{display:inline-block;margin-top:18px;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}@media(max-width:860px){.frontier-2026-head{grid-template-columns:1fr;gap:10px}.frontier-2026-grid{grid-template-columns:1fr}}\n'''
              if css_anchor not in text:
                  raise SystemExit('Homepage CSS anchor not found')
              text = text.replace(css_anchor, css + css_anchor, 1)

              section_anchor = '<section id="home-v1-release"'
              section = '''<section class="frontier-2026" aria-labelledby="frontier-2026-title"><div class="wrap"><div class="frontier-2026-head"><div><p class="eyebrow">The 2026 research frontier</p></div><div><h2 class="frontier-2026-title" id="frontier-2026-title">ET and agricultural water research in 2026</h2><p class="frontier-2026-intro">A decade ago, many university projects first had to build the data and computing machinery needed to connect satellite observations, hourly weather, soils, terrain, long simulations, and spatial analysis. In 2026, much more of that work can be organized as reusable infrastructure. The harder questions increasingly sit in the science itself.</p></div></div><div class="frontier-2026-grid"><article class="frontier-2026-card"><div class="label">What is now more practical</div><h3>Field-scale computational experiments</h3><p>Hourly seasonal simulation, 30 m spatial analysis, multi-source environmental inputs, repeatable scenarios, restartable runs, and traceable Results can be carried out as one connected research workflow.</p></article><article class="frontier-2026-card"><div class="label">What still limits the community</div><h3>Observation and scientific uncertainty</h3><p>Reliable irrigation records, root-zone soil-water measurements, continuous thermal observations, ET partitioning, parameter transferability, uncertainty, and long multi-site validation remain difficult and expensive.</p></article><article class="frontier-2026-card"><div class="label">Where BAITSSS can help</div><h3>Move effort toward the unresolved science</h3><p>BAITSSS Desktop provides a controlled project, data, execution, recovery, Results, provenance, and parameter framework so researchers can spend more of their effort testing mechanisms, observations, assumptions, sensitivity, transferability, and validation.</p></article></div><div class="frontier-2026-note"><strong>Software does not remove the need for field truth.</strong> BAITSSS can make experiments easier to define, repeat, compare, and inspect, but independent measurements and careful experimental design remain essential.</div><a class="frontier-2026-link" href="research-education/">Explore the 2026 research frontier and university opportunities →</a></div></section>\n'''
              if section_anchor not in text:
                  raise SystemExit('Homepage section anchor not found')
              text = text.replace(section_anchor, section + section_anchor, 1)
              page.write_text(text, encoding='utf-8')

          # Open animation item: make the transformation headline easier to read at a glance.
          animation = Path('animation-evaluation-chip-test.html')
          a = animation.read_text(encoding='utf-8')
          a = a.replace('.headline strong{display:block;font-size:18px;letter-spacing:.055em}', '.headline strong{display:block;font-size:23px;letter-spacing:.025em}', 1)
          animation.write_text(a, encoding='utf-8')

          # One-time migration only. Keep no live rewriting mechanism.
          Path('.github/workflows/home-2026-frontier.yml').unlink(missing_ok=True)
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Put the 2026 ET and water research frontier on the homepage"
          git push origin gh-pages
