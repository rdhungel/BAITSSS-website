name: Update homepage 2026 research focus
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/home-2026-frontier.yml']
permissions:
  contents: write
jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Replace 2026 homepage section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacement = '''<section class="frontier-2026" aria-labelledby="frontier-2026-title"><div class="wrap"><div class="frontier-2026-head"><div><p class="eyebrow">Core Research Focus · 2026</p></div><div><h2 class="frontier-2026-title" id="frontier-2026-title">Evapotranspiration and agricultural water research in 2026</h2><p class="frontier-2026-intro"><strong>Evapotranspiration (ET)</strong> is the water lost through soil evaporation and plant transpiration. It is central to agricultural water use, but ET alone is not enough. The larger system includes soil-water storage, irrigation, vegetation, weather, surface energy exchange, thermal conditions, and hydrologic response.</p></div></div><div class="frontier-2026-grid"><article class="frontier-2026-card"><div class="label">Beyond standalone ET</div><h3>Study the connected water system</h3><p>Effective agricultural water research requires ET to be examined together with soil-water storage, irrigation, vegetation, weather, surface energy exchange, thermal conditions, and hydrologic response.</p></article><article class="frontier-2026-card"><div class="label">Key scientific challenges</div><h3>What remains unresolved</h3><p>Important research priorities include irrigation measurement, root-zone soil water, thermal observations, ET partitioning, advection, hysteresis, resistance behavior, scale, uncertainty, transferability, and long-term independent validation.</p></article><article class="frontier-2026-card"><div class="label">From preprocessing to science</div><h3>Reusable infrastructure changes the work</h3><p>Modern research infrastructure can handle much more of the data assembly, preprocessing, execution, recovery, and Results workflow, shifting more of the difficult work back to field experiments, observations, theory, and comparison across models and sites.</p></article></div><div class="frontier-2026-note"><strong>Role of BAITSSS Desktop.</strong> BAITSSS provides a controlled, reproducible environment for data, parameters, execution, Results, and provenance. Its responsibility is to carry the science it implements faithfully, including assumptions, limitations, and uncertainty. <strong>Running correctly is not enough.</strong></div><div class="frontier-2026-note" style="margin-top:12px"><strong>A community enterprise.</strong> BAITSSS can provide the operational framework, but advancing process understanding remains a shared responsibility across the ET, hydrology, irrigation, remote-sensing, agricultural, atmospheric, and water-resources communities.</div><a class="frontier-2026-link" href="research-education/">Explore the 2026 research frontier and university opportunities →</a></div></section>'''
          pattern = re.compile(r'<section class="frontier-2026".*?</section>\n(?=<section id="home-v1-release")', re.S)
          s2, n = pattern.subn(replacement + '\n', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one frontier-2026 section, replaced {n}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/home-2026-frontier.yml
      - name: Commit homepage update
        run: |
          git config user.name "BAITSSS website update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/home-2026-frontier.yml
          git commit -m "Refine homepage 2026 research focus"
          git push origin gh-pages