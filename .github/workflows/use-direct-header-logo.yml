name: Use direct header logo
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/use-direct-header-logo.py'
      - '.github/workflows/use-direct-header-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/use-direct-header-logo.py
      - run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' */index.html */*/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use direct BAITSSS logo asset in site headers"
          git push origin gh-pages
