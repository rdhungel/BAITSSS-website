name: Add BAITSSS Desktop V1 homepage note

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  add-note:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Insert homepage release note
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '''</div></div></section>\n<section class="desktop-preview"'''
          block = '''</div></div></section>\n<section id="home-v1-release" style="padding:46px 0 48px;border-bottom:1px solid rgba(255,255,255,.08);background:#081522"><div class="wrap"><div style="display:grid;grid-template-columns:240px minmax(0,1fr);gap:42px;align-items:start"><div><p class="eyebrow">BAITSSS Desktop V1</p><span style="display:inline-flex;padding:6px 9px;border:1px solid rgba(201,238,130,.25);border-radius:999px;color:#c9ee82;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:rgba(201,238,130,.08)">First public release</span></div><div><h2 style="font-size:32px;line-height:1.2;margin:0 0 14px">A modern desktop environment built around the established BAITSSS science.</h2><p style="max-width:900px;margin:0 0 11px;color:#dbe7f2;font-size:16px;line-height:1.68">BAITSSS Desktop V1 brings project setup, data preparation, model execution, Results, and scientific export into one connected Windows application.</p><p style="max-width:900px;margin:0 0 11px;color:#dbe7f2;font-size:16px;line-height:1.68">The modernization balances scientific continuity with usability, versatility, computational efficiency, reproducibility, and a cleaner software architecture. Fields, simulation periods, inputs, settings, runs, maps, time series, and exports remain connected within the same project.</p><p style="max-width:900px;margin:0;color:#dbe7f2;font-size:16px;line-height:1.68">The result is a more usable and maintainable platform for field-scale analysis, research, education, model evaluation, and collaborative scientific work, while preserving the underlying BAITSSS scientific model.</p></div></div></div></section>\n<section class="desktop-preview"'''
          if 'id="home-v1-release"' not in s:
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              s = s.replace(marker, block, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit homepage note
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add BAITSSS Desktop V1 note below homepage animation"
          git push origin gh-pages
