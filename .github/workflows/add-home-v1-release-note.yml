name: Add homepage BAITSSS Desktop V1 release note

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  add-home-release-note:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Add release note below homepage animation
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="home-v1-release"' not in s:
              marker = '</div></div></section>\n<section class="desktop-preview"'
              note = '''</div></div></section>
<section class="home-v1-release" id="home-v1-release" aria-labelledby="home-v1-release-title"><div class="wrap"><div class="home-v1-release-grid"><div><p class="eyebrow">BAITSSS Desktop V1</p><div class="home-v1-release-status">First public release</div></div><div><h2 id="home-v1-release-title">A modern desktop environment built around the established BAITSSS science.</h2><p>BAITSSS Desktop V1 brings project setup, data preparation, model execution, Results, and scientific export into one connected Windows application.</p><p>The modernization balances scientific continuity with usability, versatility, computational efficiency, reproducibility, and a cleaner software architecture. Fields, simulation periods, inputs, settings, runs, maps, time series, and exports remain connected within the same project.</p><p>The result is a more usable and maintainable platform for field-scale analysis, research, education, model evaluation, and collaborative scientific work, while preserving the underlying BAITSSS scientific model.</p></div></div></div></section>
<section class="desktop-preview"'''
              if marker not in s:
                  raise SystemExit('Homepage insertion marker not found')
              s = s.replace(marker, note, 1)
              css_marker = '.desktop-preview{padding:62px 0 66px;'
              css = '.home-v1-release{padding:46px 0 48px;border-bottom:1px solid var(--line);background:#081522}.home-v1-release-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:42px;align-items:start}.home-v1-release-status{display:inline-flex;margin-top:2px;padding:6px 9px;border:1px solid rgba(201,238,130,.25);border-radius:999px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:rgba(201,238,130,.08)}.home-v1-release h2{font-size:32px;line-height:1.2;margin:0 0 14px}.home-v1-release p:not(.eyebrow){max-width:900px;margin:0 0 11px;color:#dbe7f2;font-size:16px;line-height:1.68}@media(max-width:860px){.home-v1-release-grid{grid-template-columns:1fr;gap:14px}}@media(max-width:620px){.home-v1-release{padding:40px 0 42px}.home-v1-release h2{font-size:27px}}\n'
              if css_marker not in s:
                  raise SystemExit('Homepage CSS marker not found')
              s = s.replace(css_marker, css + css_marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit homepage release note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add BAITSSS Desktop V1 release note below homepage animation"
          git push origin gh-pages
