name: Clarify BAITSSS website copyright footer
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/one-time-footer-copyright.yml']
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Replace homepage footer copyright language
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Unless otherwise noted, original figures and materials created by BAITSSS and published on this website are licensed under the Creative Commons Attribution 4.0 International License (CC BY 4.0). Please credit BAITSSS and link to the relevant BAITSSS webpage. Third-party materials remain subject to their respective licenses and copyrights.'
          new='Website information is publicly accessible for informational, research, and educational purposes. Public access does not transfer ownership or waive copyright. BAITSSS Desktop, the BAITSSS model, source code, scientific implementations, software architecture, documentation, graphics, and associated materials are copyrighted unless specifically stated otherwise. Third-party materials remain subject to their respective licenses and copyrights.'
          if old not in s:
              raise SystemExit('Expected footer text not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-footer-copyright.yml
      - name: Commit update
        run: |
          git config user.name 'rdhungel'
          git config user.email 'dhun9265@gmail.com'
          git add index.html .github/workflows/one-time-footer-copyright.yml
          git commit -m 'Clarify BAITSSS copyright and public website access'
          git push origin gh-pages