name: Match architecture heading font size
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/match-architecture-heading-size.py'
      - '.github/workflows/match-architecture-heading-size.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/match-architecture-heading-size.py
      - run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add animation-evaluation-chip-test.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Match architecture heading font size to report heading"
          git push origin gh-pages
