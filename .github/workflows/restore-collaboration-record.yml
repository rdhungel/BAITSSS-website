name: Restore collaboration record
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/restore_collaboration_record.py'
      - '.github/workflows/restore-collaboration-record.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Restore documented collaborations
        run: python .github/scripts/restore_collaboration_record.py
      - name: Commit restoration
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add access-participation/index.html SITE_CONTENT_AUTHORITY.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore documented BAITSSS collaboration record"
            git push origin gh-pages
          fi
