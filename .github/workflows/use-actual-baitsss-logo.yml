name: Use actual BAITSSS logo
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/use-actual-baitsss-logo.py'
      - '.github/workflows/use-actual-baitsss-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/use-actual-baitsss-logo.py
      - run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html' '*/*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Use actual BAITSSS Logo image in site headers"
          git push origin gh-pages
