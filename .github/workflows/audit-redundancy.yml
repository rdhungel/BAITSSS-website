name: Audit site redundancy

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/audit-redundancy.yml
      - .github/scripts/audit_redundancy.py

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Run redundancy audit
        run: python .github/scripts/audit_redundancy.py
