name: Outline page identities

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/outline-pages.yml
      - .github/scripts/outline_pages.py

jobs:
  outline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Print page outlines
        run: python .github/scripts/outline_pages.py
