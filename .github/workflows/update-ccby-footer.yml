name: Update BAITSSS website license note
on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Update homepage license note
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Materials published on the BAITSSS website may be used and shared for research, education, and other non-commercial purposes. When using material from this website, please acknowledge BAITSSS and include a link to the relevant BAITSSS webpage as the source.'
          new='Unless otherwise noted, original figures and materials created by BAITSSS and published on this website are licensed under the Creative Commons Attribution 4.0 International License (CC BY 4.0). Please credit BAITSSS and link to the relevant BAITSSS webpage. Third-party materials remain subject to their respective licenses and copyrights.'
          if old not in s:
              raise SystemExit('Existing website materials note not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify BAITSSS website materials as CC BY 4.0"
          git push origin gh-pages