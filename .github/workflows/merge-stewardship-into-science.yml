name: Merge Scientific Stewardship into Science
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/scripts/merge-stewardship-into-science.py'
      - '.github/workflows/merge-stewardship-into-science.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/merge-stewardship-into-science.py
      - run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' */index.html
          git diff --cached --quiet && exit 0
          git commit -m "Combine Scientific Stewardship with Science"
          git push origin gh-pages
