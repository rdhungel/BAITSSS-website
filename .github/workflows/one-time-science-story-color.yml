name: Normalize Science story paragraph color

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/one-time-science-story-color.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Make story lead match story paragraphs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('science/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.story-lead{color:#dce8f2!important}'
          new = '.story-lead{color:var(--text-dim)!important}'
          if old not in s:
              raise SystemExit('Expected story-lead color rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          wf = Path('.github/workflows/one-time-science-story-color.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('science/index.html').read_text(encoding='utf-8')
          assert '.story p{margin:0 0 18px;color:var(--text-dim);' in s
          assert '.story-lead{color:var(--text-dim)!important}' in s
          assert '.story-lead{color:#dce8f2!important}' not in s
          print('Science story lead now uses the same text color as all story paragraphs.')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "BAITSSS Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Match Science story paragraph colors"
          git push origin gh-pages
