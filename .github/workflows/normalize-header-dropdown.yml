name: Normalize site header and More menu

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/normalize-header-dropdown.yml
      - .github/scripts/normalize_header.py

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Normalize headers
        run: python .github/scripts/normalize_header.py
      - name: Commit changes
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add assets/site-header.css '*.html' '**/*.html'
          git commit -m "Normalize sitewide header and More menu"
          git push origin gh-pages
