name: Normalize site header and More menu

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/normalize-header-dropdown.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Normalize header markup and dropdown styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          css_path = Path('assets/site-header.css')
          css = css_path.read_text(encoding='utf-8')
          lock = '''
.site-header .more summary{color:#fff!important;cursor:pointer!important;list-style:none!important}
.site-header .more summary::-webkit-details-marker{display:none!important}
.site-header .more summary:hover{color:#c9ee82!important}
.site-header .more-menu{box-sizing:border-box!important;padding:8px!important;background:#0a1928!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:10px!important;box-shadow:0 18px 50px rgba(0,0,0,.35)!important;overflow:hidden!important}
.site-header .more-menu a{display:block!important;width:100%!important;padding:10px 11px!important;border-radius:7px!important;color:#9db0c2!important;text-decoration:none!important;font-size:13.5px!important;line-height:1.45!important;font-weight:400!important;white-space:normal!important;background:transparent!important}
.site-header .more-menu a:hover,.site-header .more-menu a.active{background:rgba(255,255,255,.04)!important;color:#c9ee82!important}
'''
          marker = '.site-header .more summary::-webkit-details-marker'
          if 'box-shadow:0 18px 50px rgba(0,0,0,.35)!important' not in css:
              css = css.rstrip() + '\n' + lock
              css_path.write_text(css, encoding='utf-8')

          top_pages = [
              ('', 'Home'),
              ('software/', 'Software'),
              ('capabilities/', 'Capabilities'),
              ('science/', 'Science'),
              ('research-education/', 'Research &amp; Education'),
              ('access-participation/', 'Access &amp; Participation'),
              ('contact/', 'Contact'),
          ]
          more_pages = [
              ('meet-the-team/', 'Development &amp; History'),
              ('published-science/', 'Published Science'),
              ('research-geography/', 'Research Geography &amp; Timeline'),
              ('faq/', 'Frequently Asked Questions'),
              ('evidence/', 'Evidence'),
              ('scientific-stewardship/', 'Scientific Stewardship'),
              ('origins-publications/', 'Origins &amp; Publications'),
              ('documentation/', 'Documentation'),
          ]

          def current_key(path):
              parts = path.parts
              if len(parts) == 1:
                  return ''
              first = parts[0]
              if first == 'research-map':
                  return 'research-geography/'
              return first + '/'

          def prefix_for(path):
              depth = len(path.parent.parts)
              return '../' * depth if depth else './'

          def href(prefix, key):
              return prefix if key == '' else prefix + key

          changed = []
          for p in root.rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              if '<header class="site-header"' not in s:
                  continue

              prefix = prefix_for(p)
              current = current_key(p)

              top_links = []
              for key, label in top_pages:
                  active = ' class="active"' if current == key else ''
                  top_links.append(f'<a{active} href="{href(prefix,key)}">{label}</a>')

              more_links = []
              for key, label in more_pages:
                  active = ' class="active"' if current == key else ''
                  more_links.append(f'<a{active} href="{href(prefix,key)}">{label}</a>')

              header = (
                  f'<header class="site-header"><a class="brand" href="{prefix}"><img src="{prefix}assets/brand-mark.svg" alt=""><span>BAITSSS</span></a>'
                  f'<button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primaryNav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>'
                  f'<nav class="primary-nav" id="primaryNav" data-open="false">'
                  + ''.join(top_links)
                  + '<details class="more"><summary>More ▾</summary><div class="more-menu">'
                  + ''.join(more_links)
                  + '</div></details></nav></header>'
              )

              s2, n = re.subn(r'<header class="site-header".*?</header>', header, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Header replacement failed for {p}')

              if "getElementById('navToggle')" not in s2 and 'getElementById("navToggle")' not in s2:
                  script = '''<script>
(function(){
  const b=document.getElementById('navToggle');
  const n=document.getElementById('primaryNav');
  if(!b||!n)return;
  b.addEventListener('click',function(){
    const open=n.getAttribute('data-open')==='true';
    n.setAttribute('data-open',open?'false':'true');
    b.setAttribute('aria-expanded',open?'false':'true');
  });
})();
</script>'''
                  s2 = s2.replace('</body>', script + '</body>', 1)

              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  changed.append(str(p))

          print('Normalized pages:')
          for name in changed:
              print(name)
          PY

      - name: Verify canonical navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          required_top = ['Home','Software','Capabilities','Science','Research &amp; Education','Access &amp; Participation','Contact']
          required_more = ['Development &amp; History','Published Science','Research Geography &amp; Timeline','Frequently Asked Questions','Evidence','Scientific Stewardship','Origins &amp; Publications','Documentation']
          failures=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              if '<header class="site-header"' not in s:
                  continue
              m=re.search(r'<header class="site-header".*?</header>',s,re.S)
              if not m:
                  failures.append(f'{p}: missing complete header')
                  continue
              h=m.group(0)
              for label in required_top + required_more:
                  if label not in h:
                      failures.append(f'{p}: missing {label}')
              if 'Development Status' in h:
                  failures.append(f'{p}: stale Development Status in menu')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Canonical navigation verification PASS')
          PY

      - name: Commit normalized header
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add assets/site-header.css '*.html' '**/*.html'
          git commit -m "Normalize sitewide header and More menu"
          git push origin gh-pages
