name: Repair page identity regression

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/repair-identity-regression.yml
      - .github/scripts/repair_identity_regression.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Repair affected pages
        run: python .github/scripts/repair_identity_regression.py
      - name: Commit repair
        run: |
          git config user.name "BAITSSS site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add research-education/index.html meet-the-team/index.html access-participation/index.html
          git commit -m "Repair page identity regression"
          git push origin gh-pages
