<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAITSSS animation visual clarity test 2</title>
<style>
html,body{margin:0;background:#07131f;color:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding:10px}
.wrap{max-width:1320px;margin:0 auto}
.note{font-size:12px;color:#8ea1b2;margin:0 0 8px 2px;letter-spacing:.02em}
iframe{display:block;width:100%;height:1000px;border:0;background:#07131f;border-radius:18px}
@media(max-width:760px){body{padding:4px}.note{font-size:10px}iframe{height:920px}}
</style>
</head>
<body>
<div class="wrap">
<p class="note">VISUAL CLARITY TEST 2 · full-width presentation · original animation logic untouched</p>
<iframe id="preview" src="/animation-evaluation.html" title="BAITSSS animation visual clarity test 2"></iframe>
</div>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const svg=doc && doc.querySelector('svg');
  if(!svg || svg.querySelector('#clarityTest2')) return;
  const NS='http://www.w3.org/2000/svg';
  const g=doc.createElementNS(NS,'g');
  g.id='clarityTest2';
  g.setAttribute('aria-hidden','true');
  g.setAttribute('pointer-events','none');
  g.innerHTML=`
    <!-- clearly visible but still secondary satellite watermark over the field side -->
    <g opacity="0.34" transform="translate(358 128) scale(2.25)" stroke="#b9d5e5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="52" y="15" width="22" height="26" rx="4" stroke-width="1.6"/>
      <rect x="4" y="13" width="40" height="30" rx="2" stroke-width="1.35"/>
      <path d="M10 19h28M10 27h28M10 35h28M17 13v30M30 13v30" stroke-width=".72"/>
      <rect x="82" y="13" width="40" height="30" rx="2" stroke-width="1.35"/>
      <path d="M88 19h28M88 27h28M88 35h28M95 13v30M108 13v30" stroke-width=".72"/>
      <path d="M44 28h8M74 28h8" stroke-width="1.45"/>
      <circle cx="63" cy="28" r="5" stroke-width="1.35"/>
      <path d="M58 42l-17 67M68 42l40 67" stroke-width="1" stroke-dasharray="3 4"/>
    </g>
    <path d="M488 224 L377 380 M548 224 L581 380" fill="none" stroke="rgba(185,213,229,.30)" stroke-width="1.8" stroke-dasharray="6 7"/>

    <!-- clearer processor/chip cue over the existing computer section -->
    <g opacity="0.30" transform="translate(840 166)">
      <rect x="0" y="0" width="150" height="112" rx="18" fill="rgba(135,215,207,.025)" stroke="#87d7cf" stroke-width="2.3"/>
      <rect x="40" y="27" width="70" height="58" rx="9" fill="rgba(201,238,130,.025)" stroke="#c9ee82" stroke-width="2.4"/>
      <path d="M12 18h28M12 38h28M12 58h28M12 78h28M12 98h28M110 18h28M110 38h28M110 58h28M110 78h28M110 98h28" stroke="#87d7cf" stroke-width="1.7"/>
      <path d="M55 10v17M75 10v17M95 10v17M55 85v17M75 85v17M95 85v17" stroke="#87d7cf" stroke-width="1.7"/>
      <circle cx="75" cy="56" r="14" fill="none" stroke="#c9ee82" stroke-width="2"/>
      <path d="M65 56h20M75 46v20M68 49l14 14M82 49L68 63" stroke="#c9ee82" stroke-width="1.5"/>
    </g>
  `;
  const defs=svg.querySelector('defs');
  if(defs && defs.nextSibling) svg.insertBefore(g,defs.nextSibling); else svg.insertBefore(g,svg.firstChild);
});
</script>
</body>
</html>
