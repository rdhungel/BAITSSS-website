<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAITSSS Runtime Architecture</title>
<style>
:root{
  --bg:#07131f;--panel:#0b1b2a;--panel2:#0d2131;--line:rgba(255,255,255,.10);
  --text:#f4f7fa;--muted:#a8b8c6;--faint:#65788a;--green:#c9ee82;
  --blue:#52b7ff;--worker:#87d7cf;--result:#caa7ff;
}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.hero{width:100%;max-width:1180px;margin:0 auto}
.frame{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#081725,#07131f)}
.topbar{height:44px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:14px;font-weight:850;letter-spacing:.10em;color:var(--text)}
svg{display:block;width:100%;height:auto;background:radial-gradient(720px 320px at 51% 38%,rgba(201,238,130,.045),transparent 70%)}
.h{font-size:18px;font-weight:800;fill:var(--text)}
.kicker{font-size:10px;font-weight:750;letter-spacing:.10em;fill:var(--faint)}
.small{font-size:12px;fill:var(--muted)}
.micro{font-size:10px;fill:var(--faint);letter-spacing:.04em}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.panel-focus{fill:var(--panel2);stroke:rgba(201,238,130,.28);stroke-width:1.5}
.ndvi{fill:rgba(201,238,130,.09);stroke:rgba(201,238,130,.36)}
.timeline{stroke:rgba(255,255,255,.17);stroke-width:2}
.grid{stroke:rgba(201,238,130,.13);stroke-width:1}
.nldas-guide{stroke:rgba(82,183,255,.32);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:3 9}
.nldas-core{stroke:rgba(82,183,255,.60);stroke-width:2;fill:none;stroke-linecap:round}
.state-guide{stroke:rgba(201,238,130,.45);stroke-width:2.2;fill:none;stroke-linecap:round}
.merge-guide{stroke:rgba(135,215,207,.42);stroke-width:2;fill:none;stroke-linecap:round}
.packet{fill:var(--blue)}
.state{fill:var(--green)}
.worker-card{fill:rgba(135,215,207,.08);stroke:rgba(135,215,207,.34);stroke-width:1.4}
.worker-dot{fill:var(--worker)}
.result-panel{fill:rgba(202,167,255,.055);stroke:rgba(202,167,255,.28);stroke-width:1.3}
.result-tile{fill:rgba(202,167,255,.10);stroke:rgba(202,167,255,.24);stroke-width:.8}
#hourText,#resultPct{font-variant-numeric:tabular-nums}
.legend{height:42px;display:flex;align-items:center;justify-content:center;gap:22px;border-top:1px solid var(--line);color:#8395a5;font-size:11px;white-space:nowrap}
.key{display:flex;align-items:center;gap:7px}.sw{width:8px;height:8px;border-radius:50%}
@media(max-width:760px){.topbar{font-size:11px}.legend{font-size:9px;gap:10px}}
</style>
</head>
<body>
<main class="hero"><section class="frame" aria-label="Animated BAITSSS runtime architecture">
<div class="topbar">BAITSSS · LIVING RUNTIME ARCHITECTURE</div>
<svg viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
<title id="title">BAITSSS living runtime architecture</title>
<desc id="desc">Landsat NDVI remains positioned across the simulation period. Hourly NLDAS forcing passes through a fixed area of interest into resident memory and parallel spatial workers. Worker results merge into one completed hourly state, which advances sequentially while outputs accumulate.</desc>
<defs>
  <symbol id="sat" viewBox="0 0 32 32"><rect x="11" y="10" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="2" y="12" width="7" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="23" y="12" width="7" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 16h2M21 16h2" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="2" fill="currentColor"/></symbol>
  <symbol id="weather" viewBox="0 0 32 32"><path d="M7 20h16a5 5 0 0 0 .5-9.98A7 7 0 0 0 10.2 9 5.8 5.8 0 0 0 7 20Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10 24-2 4m8-4-2 4m8-4-2 4" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="field" viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 13h22M5 20h22M12 6v20M20 6v20" stroke="currentColor" stroke-width="1.1"/></symbol>
  <symbol id="ram" viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="9" y="12" width="5" height="5" rx="1" fill="currentColor" opacity=".72"/><rect x="18" y="12" width="5" height="5" rx="1" fill="currentColor" opacity=".72"/><path d="M9 23v4m4-4v4m4-4v4m4-4v4m4-4v4" stroke="currentColor" stroke-width="1.4"/></symbol>
</defs>

<!-- quiet observation structure -->
<rect x="40" y="28" width="1100" height="90" rx="14" class="panel"/>
<g style="color:#c9ee82"><use href="#sat" x="64" y="46" width="26" height="26"/></g>
<text x="102" y="64" class="h" style="font-size:16px">LANDSAT / NDVI</text>
<text x="102" y="84" class="micro">OBSERVATIONS POSITIONED ACROSS THE SIMULATION PERIOD</text>
<text x="1108" y="64" text-anchor="end" class="micro" id="hourText">HOUR 0001</text>
<line x1="300" y1="83" x2="1095" y2="83" class="timeline"/>
<g id="ndviObs">
  <circle cx="345" cy="83" r="7" class="ndvi"/><circle cx="520" cy="83" r="7" class="ndvi"/><circle cx="695" cy="83" r="7" class="ndvi"/><circle cx="870" cy="83" r="7" class="ndvi"/><circle cx="1045" cy="83" r="7" class="ndvi"/>
</g>
<circle id="timeCursor" cx="300" cy="83" r="6" class="state"/>

<!-- main runtime row -->
<rect x="40" y="145" width="225" height="305" rx="16" class="panel"/>
<g style="color:#52b7ff"><use href="#weather" x="64" y="171" width="32" height="32"/></g>
<text x="108" y="187" class="kicker">HOURLY FORCING</text>
<text x="108" y="219" class="h">NLDAS</text>
<text x="64" y="245" class="small">one new forcing set each hour</text>
<text x="64" y="404" class="micro">RADIATION · AIR TEMPERATURE</text>
<text x="64" y="421" class="micro">HUMIDITY · WIND · PRECIPITATION</text>
<path id="nldasIn1" d="M72 294 C125 294 172 309 244 309" class="nldas-guide"/>
<path id="nldasIn2" d="M72 330 C125 330 172 330 244 330" class="nldas-guide"/>
<path id="nldasIn3" d="M72 366 C125 366 172 351 244 351" class="nldas-guide"/>
<circle id="n1" cx="72" cy="294" r="6" class="packet"/><circle id="n2" cx="72" cy="330" r="6" class="packet"/><circle id="n3" cx="72" cy="366" r="6" class="packet"/>

<!-- AOI is the anchor -->
<rect x="285" y="145" width="365" height="305" rx="18" class="panel-focus"/>
<g style="color:#c9ee82"><use href="#field" x="311" y="169" width="34" height="34"/></g>
<text x="359" y="185" class="kicker">FIXED SPATIAL DOMAIN</text>
<text x="359" y="219" class="h">AOI / FIELD STATE</text>
<text x="311" y="245" class="small">same field, state carried forward through time</text>
<rect x="327" y="273" width="281" height="132" rx="12" fill="rgba(201,238,130,.025)" stroke="rgba(201,238,130,.18)"/>
<path d="M383 273v132M439 273v132M495 273v132M551 273v132M327 317h281M327 361h281" class="grid"/>
<circle id="aoiState" cx="468" cy="339" r="23" class="state"/>
<circle id="aoiHalo" cx="468" cy="339" r="32" fill="none" stroke="rgba(201,238,130,.25)" stroke-width="2"/>
<text x="468" y="343" text-anchor="middle" style="font-size:9px;fill:#07131f;font-weight:900">STATE</text>
<text x="311" y="428" class="micro" id="stateText">CURRENT HOUR STATE READY</text>

<!-- through-flow visibly crosses AOI -->
<path id="through1" d="M244 309 C300 309 350 322 410 330 C470 338 565 313 690 313" class="nldas-core"/>
<path id="through2" d="M244 330 C330 330 405 339 468 339 C535 339 605 335 690 335" class="nldas-core"/>
<path id="through3" d="M244 351 C300 351 350 343 410 340 C490 337 575 357 690 357" class="nldas-core"/>
<circle id="n4" cx="244" cy="309" r="5" class="packet"/><circle id="n5" cx="244" cy="330" r="5" class="packet"/><circle id="n6" cx="244" cy="351" r="5" class="packet"/>

<!-- resident compute, simplified and stronger -->
<rect x="690" y="145" width="450" height="305" rx="16" class="panel"/>
<g style="color:#c9ee82"><use href="#ram" x="716" y="169" width="32" height="32"/></g>
<text x="762" y="185" class="kicker">RESIDENT COMPUTE</text>
<text x="762" y="219" class="h">RAM + PARALLEL WORKERS</text>
<text x="716" y="245" class="small">resident state stays in memory while spatial blocks run together</text>
<rect x="716" y="270" width="396" height="16" rx="8" fill="rgba(255,255,255,.05)"/>
<rect id="ramFill" x="716" y="270" width="88" height="16" rx="8" fill="rgba(201,238,130,.48)"/>
<text x="716" y="306" class="micro">PERSISTENT MEMORY</text>

<g id="workers">
  <g class="workerUnit"><rect x="716" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="738" cy="349" r="6" class="worker-dot"/><text x="760" y="354" class="small" style="font-weight:800">W1</text><rect x="730" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="730" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g>
  <g class="workerUnit"><rect x="818" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="840" cy="349" r="6" class="worker-dot"/><text x="862" y="354" class="small" style="font-weight:800">W2</text><rect x="832" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="832" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g>
  <g class="workerUnit"><rect x="920" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="942" cy="349" r="6" class="worker-dot"/><text x="964" y="354" class="small" style="font-weight:800">W3</text><rect x="934" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="934" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g>
  <g class="workerUnit"><rect x="1022" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="1044" cy="349" r="6" class="worker-dot"/><text x="1066" y="354" class="small" style="font-weight:800">W4</text><rect x="1036" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="1036" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g>
</g>
<path d="M690 306 C732 306 745 313 760 326M690 318 C790 318 840 322 862 326M690 342 C845 342 920 330 964 326M690 358 C910 358 1035 340 1066 326" class="state-guide" opacity=".35"/>

<!-- sequential completion and output -->
<rect x="40" y="477" width="1100" height="183" rx="16" class="panel"/>
<text x="64" y="508" class="kicker">PARALLEL SPACE COMPLETES ONE HOUR · SEQUENTIAL STATE ADVANCES</text>
<path d="M92 570 H650" class="timeline"/>
<g id="seqNodes">
  <circle id="s1" cx="118" cy="570" r="13" class="state"/><circle id="s2" cx="280" cy="570" r="13" fill="rgba(201,238,130,.15)" stroke="rgba(201,238,130,.32)"/><circle id="s3" cx="442" cy="570" r="13" fill="rgba(201,238,130,.15)" stroke="rgba(201,238,130,.32)"/><circle id="s4" cx="604" cy="570" r="13" fill="rgba(201,238,130,.15)" stroke="rgba(201,238,130,.32)"/>
</g>
<text x="118" y="602" text-anchor="middle" class="micro">HOUR n</text><text x="280" y="602" text-anchor="middle" class="micro">HOUR n+1</text><text x="442" y="602" text-anchor="middle" class="micro">HOUR n+2</text><text x="604" y="602" text-anchor="middle" class="micro">HOUR n+3</text>
<circle id="mergePulse" cx="660" cy="570" r="7" fill="#87d7cf"/>
<path d="M650 570 C690 570 702 570 730 570" class="merge-guide"/>

<rect x="730" y="510" width="382" height="118" rx="12" class="result-panel"/>
<text x="752" y="536" class="kicker">ACCUMULATING RESULTS</text>
<text x="1088" y="536" text-anchor="end" class="small" id="resultPct">0%</text>
<rect x="752" y="550" width="336" height="9" rx="4.5" fill="rgba(255,255,255,.05)"/><rect id="resultBar" x="752" y="550" width="0" height="9" rx="4.5" fill="rgba(202,167,255,.72)"/>
<g id="resultGrid">
  <rect x="752" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="800" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="848" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="896" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="944" y="574" width="42" height="30" rx="4" class="result-tile"/>
  <rect x="992" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="1040" y="574" width="48" height="30" rx="4" class="result-tile"/>
</g>
<text x="752" y="621" class="micro">ET MAP · TIME SERIES · STATE OUTPUTS · EXPORT</text>
</svg>
<div class="legend"><span class="key"><span class="sw" style="background:var(--green)"></span>sequential state</span><span class="key"><span class="sw" style="background:var(--blue)"></span>hourly forcing</span><span class="key"><span class="sw" style="background:var(--worker)"></span>parallel spatial work</span><span class="key"><span class="sw" style="background:var(--result)"></span>accumulating results</span></div>
</section></main>
<script>
(function(){
 const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), phase=(p,a,b)=>clamp((p-a)/(b-a),0,1), ease=v=>v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2;
 const inDots=[$('n1'),$('n2'),$('n3')], throughDots=[$('n4'),$('n5'),$('n6')], inPaths=[$('nldasIn1'),$('nldasIn2'),$('nldasIn3')], throughPaths=[$('through1'),$('through2'),$('through3')];
 const workerUnits=[...document.querySelectorAll('.workerUnit')], workerCards=[...document.querySelectorAll('.worker-card')], workerDots=[...document.querySelectorAll('.worker-dot')], workerBars=[...document.querySelectorAll('.workerBar')];
 const seq=[$('s1'),$('s2'),$('s3'),$('s4')], tiles=[...document.querySelectorAll('.result-tile')];
 const duration=10800, t0=performance.now();
 function moveOnPath(el,path,f){if(!el||!path)return;const L=path.getTotalLength(),pt=path.getPointAtLength(L*f);el.setAttribute('cx',pt.x.toFixed(1));el.setAttribute('cy',pt.y.toFixed(1));}
 function render(now){
   const p=((now-t0)%duration)/duration;

   // steady hourly forcing is always visible, never appears to stop at the AOI
   inDots.forEach((el,i)=>{const f=(p*2.15+i*.29)%1;moveOnPath(el,inPaths[i],f);el.style.opacity=String(.28+.72*Math.sin(f*Math.PI));});
   throughDots.forEach((el,i)=>{const f=(p*1.82+i*.23+.12)%1;moveOnPath(el,throughPaths[i],f);el.style.opacity=String(.24+.76*Math.sin(f*Math.PI));});

   // AOI is the visual anchor
   const beat=.5+.5*Math.sin(p*Math.PI*8);$('aoiState').setAttribute('r',(21+7*beat).toFixed(1));$('aoiHalo').setAttribute('r',(31+8*beat).toFixed(1));$('aoiHalo').style.opacity=String(.18+.42*beat);
   $('stateText').textContent=p<.58?'CURRENT HOUR STATE + HOURLY FORCING':'SPATIAL BLOCKS RETURN TO ONE COMPLETED STATE';

   // resident memory settles quickly and then remains resident
   const ram=ease(phase(p,.02,.20));$('ramFill').setAttribute('width',(88+282*ram).toFixed(1));

   // worker cards run visibly in parallel, staggered only slightly for legibility
   workerUnits.forEach((unit,i)=>{const c=(p*3.25+i*.07)%1,active=c<.74?Math.sin((c/.74)*Math.PI):0;workerCards[i].style.fill=`rgba(135,215,207,${.07+.38*active})`;workerCards[i].style.stroke=`rgba(135,215,207,${.28+.65*active})`;workerDots[i].setAttribute('r',(5.5+3.5*active).toFixed(1));workerBars[i].setAttribute('width',(60*(c<.74?c/.74:0)).toFixed(1));});

   // completed state advances later in each cycle
   const sp=ease(phase(p,.60,.88));
   $('timeCursor').setAttribute('cx',(300+795*sp).toFixed(1));$('hourText').textContent='HOUR '+String(Math.max(1,Math.round(1+199*sp))).padStart(4,'0');
   seq.forEach((el,i)=>{const on=sp>=i/4;el.style.fill=on?'rgba(201,238,130,.95)':'rgba(201,238,130,.15)';el.style.stroke=on?'#c9ee82':'rgba(201,238,130,.32)';});
   $('mergePulse').setAttribute('cx',(660+64*sp).toFixed(1));

   // output becomes visually substantial instead of a tiny passive progress bar
   const out=ease(phase(p,.63,1));$('resultBar').setAttribute('width',(336*out).toFixed(1));$('resultPct').textContent=Math.round(out*100)+'%';
   tiles.forEach((el,i)=>{const local=clamp((out-i*.105)/.22,0,1);el.style.fill=`rgba(202,167,255,${.07+.43*local})`;el.style.stroke=`rgba(202,167,255,${.18+.55*local})`;});
   requestAnimationFrame(render);
 }
 requestAnimationFrame(render);
})();
</script>
</body></html>
