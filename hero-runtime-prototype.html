<title>BAITSSS Runtime Architecture</title>
<style>

*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.hero{width:100%;max-width:1180px;margin:0 auto}.frame{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#081725,#07131f)}.topbar{height:44px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:18px;font-weight:850;letter-spacing:.10em;color:var(--text)}svg{display:block;width:100%;height:auto;background:radial-gradient(720px 320px at 51% 38%,rgba(201,238,130,.045),transparent 70%)}.h{font-size:18px;font-weight:800;fill:var(--text)}svg text:not(.h){display:none}.kicker{font-size:10px;font-weight:750;letter-spacing:.10em;fill:var(--faint)}.small{font-size:12px;fill:var(--muted)}.micro{font-size:10px;fill:var(--faint);letter-spacing:.04em}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}.panel-focus{fill:var(--panel2);stroke:rgba(201,238,130,.28);stroke-width:1.5}.ndvi{fill:rgba(201,238,130,.09);stroke:rgba(201,238,130,.36)}.timeline{stroke:rgba(255,255,255,.17);stroke-width:2}.grid{stroke:rgba(201,238,130,.13);stroke-width:1}.nldas-guide{stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:3 9}.nldas-core{stroke-width:2.2;fill:none;stroke-linecap:round}.state-guide{stroke:rgba(201,238,130,.45);stroke-width:2.2;fill:none;stroke-linecap:round}.merge-guide{stroke:rgba(135,215,207,.42);stroke-width:2;fill:none;stroke-linecap:round}.state{fill:var(--green)}.worker-card{fill:rgba(135,215,207,.08);stroke:rgba(135,215,207,.34);stroke-width:1.4}.worker-dot{fill:var(--worker)}.result-panel{fill:rgba(202,167,255,.055);stroke:rgba(202,167,255,.28);stroke-width:1.3}.result-tile{fill:rgba(202,167,255,.10);stroke:rgba(202,167,255,.24);stroke-width:.8}#hourText,#resultPct{font-variant-numeric:tabular-nums}.legend{height:42px;display:flex;align-items:center;justify-content:center;gap:22px;border-top:1px solid var(--line);color:#8395a5;font-size:11px;white-space:nowrap}.key{display:flex;align-items:center;gap:0;font-size:0}.sw{width:8px;height:8px;border-radius:50%}@media(max-width:760px){.topbar{font-size:14px}.legend{font-size:9px;gap:10px}}
</style>
</head>

<main class="hero"><section class="frame" aria-label="Animated BAITSSS runtime architecture">
<div class="topbar">BAITSSS · LIVING RUNTIME ARCHITECTURE</div>
<svg viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
<title id="title">BAITSSS living runtime architecture</title><desc id="desc">Landsat NDVI remains positioned across the simulation period. Four hourly NLDAS forcing streams pass through a fixed area of interest into resident memory and parallel spatial workers. Worker results merge into one completed hourly state, which advances sequentially while outputs accumulate.</desc>
<defs><symbol id="sat" viewBox="0 0 32 32"><rect x="11" y="10" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="2" y="12" width="7" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="23" y="12" width="7" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 16h2M21 16h2" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="2" fill="currentColor"/></symbol><symbol id="weather" viewBox="0 0 32 32"><path d="M7 20h16a5 5 0 0 0 .5-9.98A7 7 0 0 0 10.2 9 5.8 5.8 0 0 0 7 20Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10 24-2 4m8-4-2 4m8-4-2 4" stroke="currentColor" stroke-width="1.6"/></symbol><symbol id="field" viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 13h22M5 20h22M12 6v20M20 6v20" stroke="currentColor" stroke-width="1.1"/></symbol><symbol id="ram" viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="9" y="12" width="5" height="5" rx="1" fill="currentColor" opacity=".72"/><rect x="18" y="12" width="5" height="5" rx="1" fill="currentColor" opacity=".72"/><path d="M9 23v4m4-4v4m4-4v4m4-4v4m4-4v4" stroke="currentColor" stroke-width="1.4"/></symbol></defs>

<rect x="40" y="28" width="1100" height="90" rx="14" class="panel"/><g style="color:#c9ee82"><use href="#sat" x="64" y="46" width="26" height="26"/></g><text x="102" y="64" class="h" style="font-size:16px">LANDSAT / NDVI</text><text x="1108" y="64" text-anchor="end" class="micro" id="hourText">HOUR 0001</text><line x1="300" y1="83" x2="1095" y2="83" class="timeline"/><g id="ndviObs"><circle cx="345" cy="83" r="7" class="ndvi"/><circle cx="520" cy="83" r="7" class="ndvi"/><circle cx="695" cy="83" r="7" class="ndvi"/><circle cx="870" cy="83" r="7" class="ndvi"/><circle cx="1045" cy="83" r="7" class="ndvi"/></g><circle id="timeCursor" cx="300" cy="83" r="6" class="state"/>

<path id="through1" d="M244 302 C320 302 372 320 430 329 C505 340 585 310 690 308" class="nldas-core" stroke="rgba(82,183,255,.82)"/><path id="through2" d="M244 322 C330 322 405 332 468 336 C535 338 605 329 690 326" class="nldas-core" stroke="rgba(241,179,91,.82)"/><path id="through3" d="M244 340 C330 340 405 341 468 342 C535 343 605 345 690 344" class="nldas-core" stroke="rgba(135,215,207,.82)"/><path id="through4" d="M244 358 C315 358 365 350 425 346 C505 341 590 360 690 362" class="nldas-core" stroke="rgba(202,167,255,.82)"/>
<circle id="m1" cx="244" cy="302" r="5" fill="#52b7ff"/><circle id="m2" cx="244" cy="322" r="5" fill="#f1b35b"/><circle id="m3" cx="244" cy="340" r="5" fill="#87d7cf"/><circle id="m4" cx="244" cy="358" r="5" fill="#caa7ff"/>

<rect x="690" y="145" width="450" height="305" rx="16" class="panel"/><g style="color:#c9ee82"><use href="#ram" x="716" y="169" width="32" height="32"/></g><text x="762" y="219" class="h">RAM + PARALLEL WORKERS</text><rect x="716" y="270" width="396" height="16" rx="8" fill="rgba(255,255,255,.05)"/><rect id="ramFill" x="716" y="270" width="88" height="16" rx="8" fill="rgba(201,238,130,.48)"/><text x="716" y="306" class="micro">PERSISTENT MEMORY</text>
<g id="workers"><g class="workerUnit"><rect x="716" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="738" cy="349" r="6" class="worker-dot"/><text x="760" y="354" class="small" style="font-weight:800">W1</text><rect x="730" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="730" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g><g class="workerUnit"><rect x="818" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="840" cy="349" r="6" class="worker-dot"/><text x="862" y="354" class="small" style="font-weight:800">W2</text><rect x="832" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="832" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g><g class="workerUnit"><rect x="920" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="942" cy="349" r="6" class="worker-dot"/><text x="964" y="354" class="small" style="font-weight:800">W3</text><rect x="934" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="934" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g><g class="workerUnit"><rect x="1022" y="326" width="88" height="76" rx="10" class="worker-card"/><circle cx="1044" cy="349" r="6" class="worker-dot"/><text x="1066" y="354" class="small" style="font-weight:800">W4</text><rect x="1036" y="378" width="60" height="6" rx="3" fill="rgba(255,255,255,.06)"/><rect class="workerBar" x="1036" y="378" width="0" height="6" rx="3" fill="#87d7cf"/></g></g><path d="M690 306 C732 306 745 313 760 326M690 318 C790 318 840 322 862 326M690 342 C845 342 920 330 964 326M690 358 C910 358 1035 340 1066 326" class="state-guide" opacity=".35"/>

<rect x="40" y="477" width="1100" height="183" rx="16" class="panel"/><text x="64" y="508" class="kicker">PARALLEL SPACE COMPLETES ONE HOUR · SEQUENTIAL STATE ADVANCES</text><path d="M92 570 H650" class="timeline"/><g id="seqNodes"><circle id="s1" cx="118" cy="570" r="13" class="state"/><circle id="s2" cx="280" cy="570" r="13" fill="rgba(201,238,130,.15)" stroke="rgba(201,238,130,.32)"/><circle id="s3" cx="442" cy="570" r="13" fill="rgba(201,238,130,.15)" stroke="rgba(201,238,130,.32)"/><circle id="s4" cx="604" cy="570" r="13" fill="rgba(201,238,130,.15)" stroke="rgba(201,238,130,.32)"/></g><text x="118" y="602" text-anchor="middle" class="micro">HOUR n</text><text x="280" y="602" text-anchor="middle" class="micro">HOUR n+1</text><text x="442" y="602" text-anchor="middle" class="micro">HOUR n+2</text><text x="604" y="602" text-anchor="middle" class="micro">HOUR n+3</text><circle id="mergePulse" cx="660" cy="570" r="7" fill="#87d7cf"/><path d="M650 570 C690 570 702 570 730 570" class="merge-guide"/>
<rect x="730" y="510" width="382" height="118" rx="12" class="result-panel"/><text x="752" y="536" class="kicker">ACCUMULATING RESULTS</text><text x="1088" y="536" text-anchor="end" class="small" id="resultPct">0%</text><rect x="752" y="550" width="336" height="9" rx="4.5" fill="rgba(255,255,255,.05)"/><rect id="resultBar" x="752" y="550" width="0" height="9" rx="4.5" fill="rgba(202,167,255,.72)"/><g id="resultGrid"><rect x="752" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="800" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="848" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="896" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="944" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="992" y="574" width="42" height="30" rx="4" class="result-tile"/><rect x="1040" y="574" width="48" height="30" rx="4" class="result-tile"/></g><text x="752" y="621" class="micro">ET MAP · TIME SERIES · STATE OUTPUTS · EXPORT</text>
</svg>
<div class="legend"><span class="key"><span class="sw" style="background:var(--green)"></span>sequential state</span><span class="key"><span class="sw" style="background:var(--blue)"></span>hourly forcing</span><span class="key"><span class="sw" style="background:var(--worker)"></span>parallel spatial work</span><span class="key"><span class="sw" style="background:var(--result)"></span>accumulating results</span></div>
</section></main>
<script>(function(){const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),phase=(p,a,b)=>clamp((p-a)/(b-a),0,1),ease=v=>v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2;const inDots=[$('n1'),$('n2'),$('n3'),$('n4')],throughDots=[$('m1'),$('m2'),$('m3'),$('m4')],inPaths=[$('nldasIn1'),$('nldasIn2'),$('nldasIn3'),$('nldasIn4')],throughPaths=[$('through1'),$('through2'),$('through3'),$('through4')];const workerUnits=[...document.querySelectorAll('.workerUnit')],workerCards=[...document.querySelectorAll('.worker-card')],workerDots=[...document.querySelectorAll('.worker-dot')],workerBars=[...document.querySelectorAll('.workerBar')],seq=[$('s1'),$('s2'),$('s3'),$('s4')],tiles=[...document.querySelectorAll('.result-tile')];const duration=10800,t0=performance.now();function moveOnPath(el,path,f){if(!el||!path)return;const L=path.getTotalLength(),pt=path.getPointAtLength(L*f);el.setAttribute('cx',pt.x.toFixed(1));el.setAttribute('cy',pt.y.toFixed(1));}function render(now){const p=((now-t0)%duration)/duration;inDots.forEach((el,i)=>{const f=(p*2.1+i*.18)%1;moveOnPath(el,inPaths[i],f);el.style.opacity=String(.30+.70*Math.sin(f*Math.PI));});throughDots.forEach((el,i)=>{const f=(p*1.78+i*.16+.12)%1;moveOnPath(el,throughPaths[i],f);el.style.opacity=String(.26+.74*Math.sin(f*Math.PI));});const beat=.5+.5*Math.sin(p*Math.PI*8);$('aoiState').setAttribute('r',(21+7*beat).toFixed(1));$('aoiHalo').setAttribute('r',(31+8*beat).toFixed(1));$('aoiHalo').style.opacity=String(.18+.42*beat);$('stateText').textContent=p<.58?'CURRENT HOUR STATE + HOURLY FORCING':'SPATIAL BLOCKS RETURN TO ONE COMPLETED STATE';const ram=ease(phase(p,.02,.20));$('ramFill').setAttribute('width',(88+282*ram).toFixed(1));workerUnits.forEach((unit,i)=>{const c=(p*3.25+i*.07)%1,active=c<.74?Math.sin((c/.74)*Math.PI):0;workerCards[i].style.fill=`rgba(135,215,207,${.07+.38*active})`;workerCards[i].style.stroke=`rgba(135,215,207,${.28+.65*active})`;workerDots[i].setAttribute('r',(5.5+3.5*active).toFixed(1));workerBars[i].setAttribute('width',(60*(c<.74?c/.74:0)).toFixed(1));});const sp=ease(phase(p,.60,.88));$('timeCursor').setAttribute('cx',(300+795*sp).toFixed(1));$('hourText').textContent='HOUR '+String(Math.max(1,Math.round(1+199*sp))).padStart(4,'0');seq.forEach((el,i)=>{const on=sp>=i/4;el.style.fill=on?'rgba(201,238,130,.95)':'rgba(201,238,130,.15)';el.style.stroke=on?'#c9ee82':'rgba(201,238,130,.32)';});$('mergePulse').setAttribute('cx',(660+64*sp).toFixed(1));const out=ease(phase(p,.63,1));$('resultBar').setAttribute('width',(336*out).toFixed(1));$('resultPct').textContent=Math.round(out*100)+'%';tiles.forEach((el,i)=>{const local=clamp((out-i*.105)/.22,0,1);el.style.fill=`rgba(202,167,255,${.07+.43*local})`;el.style.stroke=`rgba(202,167,255,${.18+.55*local})`;});requestAnimationFrame(render);}requestAnimationFrame(render);})();</script>
